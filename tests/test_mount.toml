# test that an incompatible ocompat flag is a noop
[cases.test_mount_incompat_ocompat]
in = 'lfs3.c'
code = '''
    // create a superblock
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    // set the nonstandard ocompat flag
    //
    // we don't actually have ocompat flags (a third leb), but if we
    // did, we should ignore them
    //
    // note we're messing around with internals to do this! this
    // is not a user API
    uint8_t compat_buf[32];
    lfs3_ssize_t d = 0;
    lfs3_ssize_t d_ = lfs3_toleb128(
            lfs3_compat_rcompat(lfs3_fs_compat(&lfs3)),
            &compat_buf[d], 5);
    assert(d_ >= 0);
    d += d_;
    d_ = lfs3_toleb128(
            lfs3_compat_wcompat(lfs3_fs_compat(&lfs3)),
            &compat_buf[d], 5);
    assert(d_ >= 0);
    d += d_;
    // our ocompat flag!
    d_ = lfs3_toleb128(
            2,
            &compat_buf[d], 5);
    assert(d_ >= 0);
    d += d_;

    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, (const lfs3_rattr_t[]){
            LFS3_RATTR(LFS3_TAG_COMPAT, 0, 2, LFS3_FROM_BUF),
            LFS3_RATTR_ARG(compat_buf),
            LFS3_RATTR_ARG(d),
            LFS3_RATTR_NULL}) => 0;
    lfs3_unmount(&lfs3) => 0;

    // mount should _not_ fail, ocompat should be ignored
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

