# these are just a bit harder to detect
[cases.test_mount_incompat_rcompat_overflow]
defines.SHIFT = 'range(72)'
in = 'lfs3.c'
code = '''
    // create a superblock
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    // set an out-of-range rcompat flag, we can use
    // LFS3_rcompat_OVERFLOW as a starting point
    //
    // note we're messing around with internals to do this! this
    // is not a user API
    uint8_t compat_buf[32];
    lfs3_ssize_t d = 0;
    lfs3_ssize_t d_ = lfs3_toleb128(
            lfs3_compat_rcompat(lfs3_fs_compat(&lfs3))
                | ((SHIFT <= lfs3_clz(LFS3_rcompat_OVERFLOW))
                    ? LFS3_rcompat_OVERFLOW << SHIFT
                    : 0),
            &compat_buf[d], 5);
    assert(d_ >= 0);
    d += d_;
    // whoops, overflowed 32-bits?
    if (SHIFT > lfs3_clz(LFS3_rcompat_OVERFLOW)) {
        lfs3_size_t shift = SHIFT - lfs3_clz(LFS3_rcompat_OVERFLOW);
        while (shift) {
            compat_buf[d-1] |= 0x80;
            compat_buf[d] = (shift <= 7) ? 1 << shift : 0;
            d += 1;
            shift -= lfs3_min(7, shift);
        }
    }
    d_ = lfs3_toleb128(
            lfs3_compat_wcompat(lfs3_fs_compat(&lfs3)),
            &compat_buf[d], 5);
    assert(d_ >= 0);
    d += d_;

    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_mdir_commit(&lfs3, &lfs3.mroot, (const lfs3_rattr_t[]){
            LFS3_RATTR(LFS3_TAG_COMPAT, 0, 2, LFS3_FROM_BUF),
            LFS3_RATTR_ARG(compat_buf),
            LFS3_RATTR_ARG(d),
            LFS3_RATTR_NULL}) => 0;
    lfs3_unmount(&lfs3) => 0;

    // mount should now fail
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => LFS3_ERR_NOTSUP;
    lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => LFS3_ERR_NOTSUP;
'''

