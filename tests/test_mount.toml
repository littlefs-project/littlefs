                    CFG->erase(CFG, binfo.block) => 0;
                    CFG->prog(CFG, binfo.block, 0,
                            clobber_buf, BLOCK_SIZE) => 0;
                    if (binfo.btype != LFS3_BTYPE_MDIR || k == i+1) {
                        i += (binfo.btype == LFS3_BTYPE_MDIR) ? 2 : 1;
                        lfs3_trv_close(&lfs3, &trv) => 0;
                        lfs3_unmount(&lfs3) => 0;
                        goto clobbered;
                    }
                }
                k += 1;
            }
        }

    clobbered:;
        // mount with LFS3_M_CKDATA, we should detect clobbered blocks
        //
        // note LFS3_M_CKDATA implies LFS3_M_CKMETA
        lfs3_mount(&lfs3,
                LFS3_M_RDWR
                    | LFS3_M_CKDATA,
                CFG) => LFS3_ERR_CORRUPT;
    }
