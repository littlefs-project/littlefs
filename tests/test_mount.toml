# test that on-mount traversals do what they say they do

[cases.test_mount_t_lookahead]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    // by default we need a lookahead scan
    //
    // unless we have a gbmap, the gbmap is persistent so usually
    // _doesn't_ need a lookahead scan
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;

    // with LFS3_M_LOOKAHEAD, mount performs a lookahead scan
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | LFS3_M_LOOKAHEAD
                | ((CKMETA) ? LFS3_M_CKMETA : 0)
                | ((CKDATA) ? LFS3_M_CKDATA : 0),
            CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mount_t_lookgbmap]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = [
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
ifdef = 'LFS3_GBMAP'
if = 'GBMAP'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    uint32_t prng = 42;

    // gbmap is persistent, so by default we _don't_ need a gbmap scan
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    // write to a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;

    // but if we allocated any blocks our gbmap will be inexhaustive
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_I_LOOKGBMAP
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;

    // with LFS3_M_LOOKAHEAD, mount rebuilds the gbmap
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | ((LOOKAHEAD) ? LFS3_M_LOOKAHEAD : 0)
                | LFS3_M_LOOKGBMAP
                | ((CKMETA) ? LFS3_M_CKMETA : 0)
                | ((CKDATA) ? LFS3_M_CKDATA : 0),
            CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mount_t_persistlookahead]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = [
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
ifdef = 'LFS3_GBMAP'
if = 'GBMAP'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    uint32_t prng = 42;

    // gbmap is persistent, so by default we _don't_ need a gbmap scan
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    // scrub format state
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        LFS3_ASSERT(i < 2*BLOCK_COUNT);

        // create a small file
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, "jelly",
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_TRUNC) => 0;
        uint8_t wbuf[BLOCK_SIZE];
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE) => BLOCK_SIZE;
        lfs3_file_close(&lfs3, &file) => 0;

        // cleared format state?
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (fsinfo.flags & LFS3_I_LOOKGBMAP) {
            break;
        }
    }
    lfs3_unmount(&lfs3) => 0;

    // if we scrub format state our gbmap will be inexhaustive
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_I_LOOKGBMAP
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;

    // with LFS3_M_LOOKGBMAP, mount persists lookahead
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | ((LOOKAHEAD) ? LFS3_M_LOOKAHEAD : 0)
                | LFS3_M_LOOKGBMAP
                | ((CKMETA) ? LFS3_M_CKMETA : 0)
                | ((CKDATA) ? LFS3_M_CKDATA : 0),
            CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mount_t_preerase]
defines.LOOKAHEAD = [false, true]
defines.LOOKGBMAP = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = [
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
# REMOUNT=0 => don't remount
# REMOUNT=1 => remount with preerase
# REMOUNT=2 => remount without preerase
defines.REMOUNT = [0, 1, 2]
# note preerasing needs revperturb
defines.REV_FLAGS = 'LFS3_REV_REVPERTURB'
# test with a number of different erase values
defines.ERASE_VALUE = [0xff, 0x00, -1]
ifdef = ['LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
if = 'GBMAP'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    uint32_t prng = 42;

    // by default, we don't preerase
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            LFS3_I_PREERASE
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;

    // with LFS3_M_PREERASE, mount preerases a configurable number of
    // blocks
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | ((LOOKAHEAD) ? LFS3_M_LOOKAHEAD : 0)
                | ((LOOKGBMAP) ? LFS3_M_LOOKGBMAP : 0)
                | LFS3_M_PREERASE,
            CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!LOOKGBMAP) ? LFS3_I_LOOKGBMAP : 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // remount?
    //
    // preerasing is persistent, but our preeraser doesn't know the
    // gbmap state until triggered at least once
    if (REMOUNT) {
        lfs3_unmount(&lfs3) => 0;
        lfs3_mount(&lfs3,
                LFS3_M_RDWR
                    | ((REMOUNT == 1 && LOOKAHEAD) ? LFS3_M_LOOKAHEAD : 0)
                    | ((REMOUNT == 1) ? LFS3_M_PREERASE : 0),
                CFG) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(fsinfo.flags == (
                ((!LOOKGBMAP) ? LFS3_I_LOOKGBMAP : 0)
                    | ((REMOUNT != 1) ? LFS3_I_PREERASE : 0)
                    | LFS3_I_COMPACTMETA
                    | LFS3_I_CKMETA
                    | LFS3_I_CKDATA
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    }

    // write to a file to try to make sure nothing obvious is broken
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mount_t_compact]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    uint32_t prng = 42;

    // first lets create a compactable filesystem
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // write to our mdir until >gc_compact_thresh full
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // hack, don't use the internals like this
    uint8_t wbuf[SIZE];
    while ((file.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;

    // by default mount does not compact
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && SIZE >= BLOCK_SIZE/4)
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;

    // with LFS3_M_COMPACTMETA, mount compacts any uncompacted blocks
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | LFS3_M_COMPACTMETA
                | ((LOOKAHEAD) ? LFS3_M_LOOKAHEAD : 0)
                | ((CKMETA) ? LFS3_M_CKMETA : 0)
                | ((CKDATA) ? LFS3_M_CKDATA : 0),
            CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!LOOKAHEAD && !GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && SIZE >= BLOCK_SIZE/4)
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // mdir should have been compacted
    lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
    assert((file.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH);

    // check we can still read the file
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_mount_t_mkconsistent]
defines.LOOKAHEAD = [false, true]
defines.COMPACTMETA = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = 'FCACHE_SIZE/2'
# <=2 => grm-able
#  >2 => requires orphans
defines.ORPHANS = [0, 1, 2, 3, 100]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;

    uint32_t prng = 42;

    // first lets create some orphans
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // create two files
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "cuttlefish",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf1[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf1, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_file_open(&lfs3, &file, "octopus",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf2[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf2, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    // create this many orphaned files
    //
    // anytime we close a not-yet-created desync file, we create an
    // orphan, but note we need these to be different files, and we need
    // to close them after all open calls, otherwise we just end up with
    // one orphan (littlefs is eager to clean up orphans)
    //
    lfs3_file_t orphans[ORPHANS];
    for (lfs3_size_t i = 0; i < ORPHANS; i++) {
        char name[256];
        sprintf(name, "jellyfish%03x", i);
        lfs3_file_open(&lfs3, &orphans[i], name,
                LFS3_O_WRONLY
                    | LFS3_O_CREAT
                    | LFS3_O_EXCL
                    | LFS3_O_DESYNC) => 0;
    }
    for (lfs3_size_t i = 0; i < ORPHANS; i++) {
        lfs3_file_close(&lfs3, &orphans[i]) => 0;
    }

    lfs3_unmount(&lfs3) => 0;

    // by default we clean up orphans lazily
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((ORPHANS > 0) ? LFS3_I_MKNOSTICKYORPHANS : 0)
                | ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && ORPHANS >= 100)
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));
    lfs3_unmount(&lfs3) => 0;

    // with LFS3_M_MKCONSISTENT, mount cleans up orphans eagerly
    lfs3_mount(&lfs3,
            LFS3_M_RDWR
                | LFS3_M_MKCONSISTENT
                | ((LOOKAHEAD) ? LFS3_M_LOOKAHEAD : 0)
                | ((COMPACTMETA) ? LFS3_M_COMPACTMETA : 0)
                | ((CKMETA) ? LFS3_M_CKMETA : 0)
                | ((CKDATA) ? LFS3_M_CKDATA : 0),
            CFG) => 0;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!LOOKAHEAD && !GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && ORPHANS >= 100)
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | ((!COMPACTMETA) ? LFS3_I_COMPACTMETA : 0)
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // check we can still read the files
    lfs3_file_open(&lfs3, &file, "cuttlefish", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf1, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_file_open(&lfs3, &file, "octopus", LFS3_O_RDONLY) => 0;
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf2, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

# test we can detect at least fully clobbered blocks
#
# these are tested more thoroughly in test_ck
[cases.test_mount_t_ckmeta]
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = '(SIZE*N)/BLOCK_SIZE <= 32'
code = '''
    lfs3_block_t i = 0;
    while (true) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_t lfs3;
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

        // create an interesting filesystem
        uint32_t prng = 42;
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "squid%03x", i);

            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;
        }

        // traverse to find blocks
        lfs3_trv_t trv;
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        lfs3_block_t k = 0;
        for (lfs3_block_t j = 0;; j++) {
            assert(j < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                lfs3_trv_close(&lfs3, &trv) => 0;
                lfs3_unmount(&lfs3) => 0;
                goto done;
            }

            // this gets a bit tricky be cause we need to clobber both
            // blocks in mdir pairs
            if (binfo.btype == LFS3_BTYPE_MDIR
                    || binfo.btype == LFS3_BTYPE_BTREE) {
                if (k == i || k == i+1) {
                    // clobber this block
                    printf("clobbering 0x%x\n", binfo.block);
                    uint8_t clobber_buf[BLOCK_SIZE];
                    memset(clobber_buf, 0xcc, BLOCK_SIZE);
                    CFG->erase(CFG, binfo.block) => 0;
                    CFG->prog(CFG, binfo.block, 0,
                            clobber_buf, BLOCK_SIZE) => 0;
                    if (binfo.btype != LFS3_BTYPE_MDIR || k == i+1) {
                        i += (binfo.btype == LFS3_BTYPE_MDIR) ? 2 : 1;
                        lfs3_trv_close(&lfs3, &trv) => 0;
                        lfs3_unmount(&lfs3) => 0;
                        goto clobbered;
                    }
                }
                k += 1;
            }
        }

    clobbered:;
        // mount with LFS3_M_CKMETA, we should detect clobbered blocks
        lfs3_mount(&lfs3,
                LFS3_M_RDWR
                    | LFS3_M_CKMETA,
                CFG) => LFS3_ERR_CORRUPT;
    }
done:;
'''

[cases.test_mount_t_ckdata]
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.SIZE = [
    '0',
