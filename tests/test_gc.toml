# test we can repair arbitrary blocks
#
# these are tested more thoroughly in test_evict/test_badblocks/
# test_exhaustion
[cases.test_gc_ckrepairmeta]
defines.GC_FLAGS = 'LFS3_GC_CKMETA | LFS3_GC_REPAIRMETA'
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
if = '(SIZE*N)/BLOCK_SIZE <= 32'
ifdef = ['LFS3_GC', 'LFS3_REPAIR']
code = '''
    lfs3_block_t i = 0;
    lfs3_block_t victim;
    while (true) {
        // a bit hacky, but this catches infinite loops
        assert(i < 299*BLOCK_COUNT);

        lfs3_t lfs3;
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

        // create an interesting filesystem
        uint32_t prng = 42;
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "squid%03x", i);

            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;
        }

        // traverse to find blocks
        lfs3_trv_t trv;
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        lfs3_block_t k = 0;
        for (lfs3_block_t j = 0;; j++) {
            assert(j < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                lfs3_trv_close(&lfs3, &trv) => 0;
                lfs3_unmount(&lfs3) => 0;
                goto done;
            }

            // found a block to damage?
            //
            // with mdirs we might be damaging the spare block, but
            // that's ok, we ignore it below
            if (binfo.btype == LFS3_BTYPE_MDIR
                    || binfo.btype == LFS3_BTYPE_BTREE) {
                if (k == i) {
                    // damage this block
                    printf("damaging 0x%x\n", binfo.block);
                    // make bad
                    victim = binfo.block;
                    lfs3_emubd_mkbad(CFG, victim) => 0;
                    i += 1;
                    lfs3_trv_close(&lfs3, &trv) => 0;
                    goto damaged;
                }
                k += 1;
            }
        }

    damaged:;
        // running lfs3_fs_gc should eventually repair the damaged block
        for (lfs3_block_t i = 0;; i++) {
            // a bit hacky, but this catches infinite loops
            LFS3_ASSERT(i < 2*BLOCK_COUNT);

            lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
            assert(steps >= 0);
            if (steps == 0) {
                break;
            }
        }

        // the ck/repair flags should been clear
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(!(fsinfo.flags & (LFS3_I_CKMETA | LFS3_I_REPAIRMETA)));

        // evicted block should no longer be in use, anywhere in the
        // filesystem
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        for (lfs3_block_t i = 0;; i++) {
            assert(i < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }

            #ifdef LFS3_GBMAP
            if (binfo.btype == LFS3_BTYPE_BAD) {
                continue;
            }
            #endif

            // hmm, ignore the mrootanchor, which we _can_ repair, but
            // not evict
            if (binfo.block != 0
                    && binfo.block != 1
                    // hmm, and the mdir's spare blocks, these don't
                    // actually store anything at rest
                    && !(binfo.btype == LFS3_BTYPE_MDIR
                        && trv.blocks[0] == -1)) {
                assert(binfo.block != victim);
            }
        }
        lfs3_trv_close(&lfs3, &trv) => 0;

        // reset damaged block
        lfs3_emubd_mkgood(CFG, victim) => 0;

        lfs3_unmount(&lfs3) => 0;
    }
done:;
'''

