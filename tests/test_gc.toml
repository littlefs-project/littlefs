            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // try gcing and compacting
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc,
            LFS3_GC_COMPACTMETA
                | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
                | ((CKMETA) ? LFS3_GC_CKMETA : 0)
                | ((CKDATA) ? LFS3_GC_CKDATA : 0)) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

    // mtree should have been compacted
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        if (binfo.btype == LFS3_BTYPE_BTREE) {
            // hack, don't use the internals like this
            lfs3_rbyd_t rbyd;
            lfs3_rbyd_fetch(&lfs3, &rbyd, binfo.block, -1,
                    LFS3_RBYD_RELAX) => 0;
            assert(lfs3_rbyd_eoff(&rbyd) <= GC_COMPACTMETA_THRESH);
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // uncompacted flag should have been cleared
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
