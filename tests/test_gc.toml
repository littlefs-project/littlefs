# Test GC things
after = ['test_trvs', 'test_evict']

# Test both with and without the gbmap if available
defines.GBMAP = [false, true]
if = 'LFS3_IFYES_GBMAP(GBMAP, true, !GBMAP)'
# set gc_lookgbmap_thresh extremely high to stress things
defines.GC_LOOKGBMAP_THRESH = 'BLOCK_COUNT-1'


# This suite it sort of divided into two parts
# - low-level gc traversal tests (test_gc_t_*)
# - high-level incremental gc tests (test_gc_*)
#
# Originally lfs3_trv_t supported gc operations, and most of these tests
# lived in test_trvs.toml, but this design proved more complicated than
# it was worth so lfs3_trv_t was split into lfs3_trv_t and lfs3_gc_t.
#
# Most of these tests were then copied over and freshened up a bit, but
# there may be some lingering quirks.
#
# Note most of the incremental gc tests need LFS3_GC to run
#
# Most low-level eviction tests were also moved to test_evict.toml
#

### Low-level gc traversal tests  ###

# a simple traversal test
[cases.test_gc_t_simple]
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.LOOKGBMAP = [false, true]
defines.COMPACTMETA = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
if = 'GBMAP || !LOOKGBMAP'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // try gcing
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc,
            ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
                | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
                | ((LOOKGBMAP)
                    ? LFS3_IFDEF_GBMAP(LFS3_GC_LOOKGBMAP, -1)
                    : 0)
                | ((COMPACTMETA) ? LFS3_GC_COMPACTMETA : 0)
                | ((CKMETA) ? LFS3_GC_CKMETA : 0)
                | ((CKDATA) ? LFS3_GC_CKDATA : 0)) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

    lfs3_unmount(&lfs3) => 0;
'''

