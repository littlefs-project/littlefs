[cases.test_gc_t_mkconsistent_compact]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = 'FCACHE_SIZE/2'
# <=2 => grm-able
#  >2 => requires orphans
defines.ORPHANS = [0, 1, 2, 3, 100]
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create two files
    lfs3_file_t file1;
    lfs3_file_open(&lfs3, &file1, "cuttlefish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf1[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file1) => 0;

    lfs3_file_t file2;
    lfs3_file_open(&lfs3, &file2, "octopus",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf2[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file2, wbuf2, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file2) => 0;

    // create this many orphaned files
    //
    // anytime we close a not-yet-created desync file, we create an
    // orphan, but note we need these to be different files, and we need
    // to close them after all open calls, otherwise we just end up with
    // one orphan (littlefs is eager to clean up orphans)
    //
    lfs3_file_t orphans[ORPHANS];
    for (lfs3_size_t i = 0; i < ORPHANS; i++) {
        char name[256];
        sprintf(name, "jellyfish%03x", i);
        lfs3_file_open(&lfs3, &orphans[i], name,
                LFS3_O_WRONLY
                    | LFS3_O_CREAT
                    | LFS3_O_EXCL
                    | LFS3_O_DESYNC) => 0;
    }
    for (lfs3_size_t i = 0; i < ORPHANS; i++) {
        lfs3_file_close(&lfs3, &orphans[i]) => 0;
    }

    // write to our mdirs until >gc_compact_thresh full
    //
    // hack, don't use the internals like this
    while ((file1.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file1) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file1) => 0;
    }

    while ((file2.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file2) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file2, wbuf2, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file2) => 0;
    }

    // we should be marked as inconsistent and uncompacted
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((ORPHANS > 0) ? LFS3_I_MKNOGRM : 0)
                | ((ORPHANS >= 3) ? LFS3_I_MKNOORPHANNOTES : 0)
                | ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                | ((ORPHANS >= 3) ? LFS3_I_GRMOVERFLOW : 0)));

    // try gcing with mkconsistent
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc,
            LFS3_GC_MKCONSISTENT
                | LFS3_GC_COMPACTMETA
                | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
                | ((CKMETA) ? LFS3_GC_CKMETA : 0)
                | ((CKDATA) ? LFS3_GC_CKDATA : 0)) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

    // we should have cleaned up all grms/orphans
    assert(lfs3.grm.queue[0] == 0);
    assert(lfs3.grm.queue[1] == 0);
    assert(!(lfs3.flags & LFS3_I_MKNOORPHANNOTES));

    // which means there shouldn't be that many files left
    assert(lfs3.mtree.weight <= (2 << lfs3.mbits));
    assert(file1.h.mdir.r.weight <= 3);
    assert(file2.h.mdir.r.weight <= 3);

    // mdirs should have been compacted
    assert((file1.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH);
    assert((file2.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH);

    // we should be marked as consistent and compacted
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!LOOKAHEAD && !GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                | ((ORPHANS >= 3) ? LFS3_I_GRMOVERFLOW : 0)));

    // check we can still read the files
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file1) => 0;
            lfs3_file_close(&lfs3, &file2) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file1, "cuttlefish", LFS3_O_RDONLY) => 0;
            lfs3_file_open(&lfs3, &file2, "octopus", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file1) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file1, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf1, SIZE) == 0);

        lfs3_file_rewind(&lfs3, &file2) => 0;
        lfs3_file_read(&lfs3, &file2, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf2, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file1) => 0;
    lfs3_file_close(&lfs3, &file2) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_gc_t_mkconsistent_compact_conflict]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = 'FCACHE_SIZE/2'
# <=2 => grm-able
#  >2 => requires orphans
defines.ORPHANS = [0, 1, 2, 3, 100]
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create two files
    lfs3_file_t file1;
    lfs3_file_open(&lfs3, &file1, "cuttlefish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf1[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file1) => 0;

    lfs3_file_t file2;
    lfs3_file_open(&lfs3, &file2, "octopus",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf2[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file2, wbuf2, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file2) => 0;

    // write to our mdirs until >gc_compact_thresh full
    //
    // hack, don't use the internals like this
    while ((file1.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file1) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file1) => 0;
    }

    while ((file2.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file2) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file2, wbuf2, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file2) => 0;
    }

    // we should not be marked as inconsistent
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // try gcing with mkconsistent
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc,
            LFS3_GC_MKCONSISTENT
                | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
                | ((CKMETA) ? LFS3_GC_CKMETA : 0)
                | ((CKDATA) ? LFS3_GC_CKDATA : 0)) => 0;
    // gc once
    lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
    assert(steps >= 0);

    // create this many orphaned files
    //
    // anytime we close a not-yet-created desync file, we create an
    // orphan, but note we need these to be different files, and we need
    // to close them after all open calls, otherwise we just end up with
    // one orphan (littlefs is eager to clean up orphans)
    //
    lfs3_file_t orphans[ORPHANS];
    for (lfs3_size_t i = 0; i < ORPHANS; i++) {
        char name[256];
        sprintf(name, "jellyfish%03x", i);
        lfs3_file_open(&lfs3, &orphans[i], name,
                LFS3_O_WRONLY
                    | LFS3_O_CREAT
                    | LFS3_O_EXCL
                    | LFS3_O_DESYNC) => 0;
    }
    for (lfs3_size_t i = 0; i < ORPHANS; i++) {
        lfs3_file_close(&lfs3, &orphans[i]) => 0;
    }

    // gc one more time
    steps = lfs3_gc_write(&lfs3, &gc, 1);
    assert(steps >= 0);
    lfs3_gc_close(&lfs3, &gc) => 0;

    // we should be able to clean up grms, well, unless we progressed
    // some other traverals
    if (false) {
        assert(lfs3.grm.queue[0] == 0);
        assert(lfs3.grm.queue[1] == 0);
    }
    // if we introduce actual orphans, me _must not_ clear the orphan flag
    if (ORPHANS >= 3) {
        assert(lfs3.flags & LFS3_I_MKNOORPHANNOTES);
    }

    //// mdirs should have been compacted
    //assert((file1.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH);
    //assert((file2.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH);

    // if we introduced actual orphans, we _must_ be marked as inconsistent
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((((LOOKAHEAD && !GBMAP) || CKMETA || CKDATA) && ORPHANS > 0)
                    ? LFS3_I_MKNOGRM
                    : 0)
                | ((ORPHANS >= 3) ? LFS3_I_MKNOORPHANNOTES : 0)
                | (((!LOOKAHEAD || ORPHANS > 0) && (!GBMAP))
                    ? LFS3_I_LOOKAHEAD
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | (((!CKMETA && !CKDATA) || GBMAP || ORPHANS > 0)
                    ? LFS3_I_CKMETA
                    : 0)
                | ((!CKDATA || GBMAP || ORPHANS > 0)
                    ? LFS3_I_CKDATA
                    : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                | ((ORPHANS >= 3) ? LFS3_I_GRMOVERFLOW : 0)));

    // check we can still read the files
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file1) => 0;
            lfs3_file_close(&lfs3, &file2) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file1, "cuttlefish", LFS3_O_RDONLY) => 0;
            lfs3_file_open(&lfs3, &file2, "octopus", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file1) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file1, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf1, SIZE) == 0);

        lfs3_file_rewind(&lfs3, &file2) => 0;
        lfs3_file_read(&lfs3, &file2, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf2, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file1) => 0;
    lfs3_file_close(&lfs3, &file2) => 0;
    lfs3_unmount(&lfs3) => 0;
'''




