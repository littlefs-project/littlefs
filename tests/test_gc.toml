                goto done;
            }

            // this gets a bit tricky be cause we need to clobber both
            // blocks in mdir pairs
            if (binfo.btype == LFS3_BTYPE_MDIR
                    || binfo.btype == LFS3_BTYPE_BTREE
                    || binfo.btype == LFS3_BTYPE_DATA) {
                if (k == i || k == i+1) {
