# test we can detect fully clobbered blocks after a ck pass, if we call
# lfs3_fs_requestck
[cases.test_gc_ckmeta_requestck]
# AFTER=0 => after running lfs3_fs_gc once
# AFTER=1 => after running lfs3_fs_gc to completion
# AFTER=2 => after running lfs3_trv_t
# AFTER=3 => after running lfs3_gc_t
# AFTER=4 => after lfs3_fs_ckmeta
# AFTER=5 => after remounting with LFS3_M_CKMETA
defines.AFTER = [0, 1, 2, 3, 4, 5]
defines.GC_FLAGS = 'LFS3_GC_CKMETA'
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = '(SIZE*N)/BLOCK_SIZE <= 32'
ifdef = 'LFS3_GC'
code = '''
    lfs3_block_t i = 0;
    while (true) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_t lfs3;
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

        // create an interesting filesystem
        uint32_t prng = 42;
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "squid%03x", i);

            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;
        }

        // run lfs3_fs_gc before clobbering, this should not find
        // anything

        // run lfs3_fs_gc once
        if (AFTER == 0) {
            lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
            assert(steps >= 0);

        // run lfs3_fs_gc to completion
        } else if (AFTER == 1) {
            while (true) {
                struct lfs3_fsinfo fsinfo;
                lfs3_fs_stat(&lfs3, &fsinfo) => 0;
                if (!(fsinfo.flags & LFS3_I_CKMETA)) {
                    break;
                }

                lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
                assert(steps >= 0);
            }

        // run lfs3_trv_t
        } else if (AFTER == 2) {
            lfs3_trv_t trv;
            lfs3_trv_open(&lfs3, &trv, GC_FLAGS) => 0;
            while (true) {
                struct lfs3_binfo binfo;
                int err = lfs3_trv_read(&lfs3, &trv, &binfo);
                assert(!err || err == LFS3_ERR_NOENT);
                if (err == LFS3_ERR_NOENT) {
                    break;
                }
            }
            lfs3_trv_close(&lfs3, &trv) => 0;

        // run lfs3_gc_t
        } else if (AFTER == 3) {
            lfs3_gc_t gc;
            lfs3_gc_open(&lfs3, &gc, GC_FLAGS) => 0;
            while (true) {
                lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
                assert(steps >= 0);
                if (steps == 0) {
                    break;
                }
            }
            lfs3_gc_close(&lfs3, &gc) => 0;

        // run lfs3_fs_ckmeta
        } else if (AFTER == 4) {
            lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;

            struct lfs3_fsinfo fsinfo;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            assert(!(fsinfo.flags & LFS3_I_CKMETA));

        // remount with LFS3_M_CKMETA
        } else if (AFTER == 5) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR | LFS3_M_CKMETA, CFG) => 0;

            struct lfs3_fsinfo fsinfo;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            assert(!(fsinfo.flags & LFS3_I_CKMETA));

        } else {
            assert(false);
        }

        // traverse to find blocks
        lfs3_trv_t trv;
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        lfs3_block_t k = 0;
        for (lfs3_block_t j = 0;; j++) {
            assert(j < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                lfs3_trv_close(&lfs3, &trv) => 0;
                lfs3_unmount(&lfs3) => 0;
                goto done;
            }

            // this gets a bit tricky be cause we need to clobber both
            // blocks in mdir pairs
            if (binfo.btype == LFS3_BTYPE_MDIR
                    || binfo.btype == LFS3_BTYPE_BTREE) {
                if (k == i || k == i+1) {
                    // clobber this block
                    printf("clobbering 0x%x\n", binfo.block);
                    uint8_t clobber_buf[BLOCK_SIZE];
                    memset(clobber_buf, 0xcc, BLOCK_SIZE);
                    CFG->erase(CFG, binfo.block) => 0;
                    CFG->prog(CFG, binfo.block, 0,
                            clobber_buf, BLOCK_SIZE) => 0;
                    if (binfo.btype != LFS3_BTYPE_MDIR || k == i+1) {
                        i += (binfo.btype == LFS3_BTYPE_MDIR) ? 2 : 1;
                        lfs3_trv_close(&lfs3, &trv) => 0;
                        goto clobbered;
                    }
                }
                k += 1;
            }
        }

    clobbered:;
        // request relevant ck flags
        lfs3_fs_requestck(&lfs3, LFS3_I_CKMETA) => 0;

        // running lfs3_fs_gc should eventually find the clobbered block
        for (lfs3_block_t i = 0;; i++) {
            // a bit hacky, but this catches infinite loops
            LFS3_ASSERT(i < 2*BLOCK_COUNT);

            lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
            assert(steps >= 0 || steps == LFS3_ERR_CORRUPT);
            // found it
            if (steps == LFS3_ERR_CORRUPT) {
                break;
            }
        }

        lfs3_unmount(&lfs3) => 0;
    }
done:;
'''

