    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
if = '(SIZE*N)/BLOCK_SIZE <= 32'
ifdef = ['LFS3_GC', 'LFS3_REPAIR']
code = '''
    lfs3_block_t i = 0;
    lfs3_block_t victim;
    while (true) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_t lfs3;
        lfs3_format(&lfs3,
                LFS3_F_RDWR
                    | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
                CFG) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

        // create an interesting filesystem
        uint32_t prng = 42;
        for (lfs3_size_t i = 0; i < N; i++) {
            char name[256];
            sprintf(name, "squid%03x", i);

            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }

            lfs3_file_t file;
            lfs3_file_open(&lfs3, &file, name,
                    LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;
        }

        // traverse to find blocks
        lfs3_trv_t trv;
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        lfs3_block_t k = 0;
        for (lfs3_block_t j = 0;; j++) {
            assert(j < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                lfs3_trv_close(&lfs3, &trv) => 0;
                lfs3_unmount(&lfs3) => 0;
                goto done;
            }

            // found a block to damage?
            //
            // with mdirs we might be damaging the spare block, but
            // that's ok, we ignore it below
            if (binfo.btype == LFS3_BTYPE_DATA) {
                if (k == i) {
                    // damage this block
                    printf("damaging 0x%x\n", binfo.block);
                    // make bad
                    victim = binfo.block;
                    lfs3_emubd_mkbad(CFG, victim) => 0;
                    i += 1;
                    lfs3_trv_close(&lfs3, &trv) => 0;
                    goto damaged;
                }
                k += 1;
            }
        }

    damaged:;
        // lfs3_fs_repair should find and repair the clobbered block
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_CKDATA | LFS3_REPAIR_REPAIRDATA) => 0;

        // the ck/repair flags should been clear
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert(!(fsinfo.flags & (LFS3_I_CKDATA | LFS3_I_REPAIRDATA)));

        // evicted block should no longer be in use, anywhere in the
        // filesystem
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        for (lfs3_block_t i = 0;; i++) {
            assert(i < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }

            #ifdef LFS3_GBMAP
            if (binfo.btype == LFS3_BTYPE_BAD) {
                continue;
            }
            #endif

            // hmm, ignore the mrootanchor, which we _can_ repair, but
            // not evict
            if (binfo.block != 0
                    && binfo.block != 1
                    // hmm, and the mdir's spare blocks, these don't
                    // actually store anything at rest
                    && !(binfo.btype == LFS3_BTYPE_MDIR
                        && trv.blocks[0] == -1)) {
                assert(binfo.block != victim);
            }
        }
        lfs3_trv_close(&lfs3, &trv) => 0;

        // reset damaged block
        lfs3_emubd_mkgood(CFG, victim) => 0;

        lfs3_unmount(&lfs3) => 0;
    }
done:;
'''



# test that gc work clears flags in lfs3_fs_stat
[cases.test_gc_iflags]
# AFTER=0 => after running lfs3_fs_gc
# AFTER=1 => after running lfs3_gc_t
# AFTER=2 => after explicit operations
# AFTER=3 => after remounting
defines.AFTER = [0, 1, 2, 3]
defines.MKCONSISTENT = [false, true]
defines.LOOKAHEAD = [false, true]
defines.LOOKGBMAP = [false, true]
defines.PREERASE = [false, true]
defines.COMPACTMETA = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.REPAIRMETA = [false, true]
defines.REPAIRDATA = [false, true]
defines.GC_FLAGS = '''
    ((MKCONSISTENT) ? LFS3_GC_MKCONSISTENT : 0)
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((LOOKGBMAP) ? LFS3_IFDEF_GBMAP(LFS3_GC_LOOKGBMAP, -1) : 0)
        | ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_GC_PREERASE, -1) : 0)
        | ((COMPACTMETA) ? LFS3_GC_COMPACTMETA : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
        | ((REPAIRMETA) ? LFS3_IFDEF_REPAIR(LFS3_GC_REPAIRMETA, -1) : 0)
        | ((REPAIRDATA) ? LFS3_IFDEF_REPAIR(LFS3_GC_REPAIRDATA, -1) : 0)
'''
defines.GC_STEPS = -1
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
# note preerasing needs revperturb
defines.REV_FLAGS = '''
    ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_REV_REVPERTURB, -1) : 0)
'''
defines.N = [1, 2, 4, 8, 16, 32, 64]
defines.SIZE = [
    '0',
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
if = [
    '(SIZE*N)/BLOCK_SIZE <= 32',
    'LFS3_IFDEF_GC(true, AFTER != 0)',
    'LFS3_IFDEF_GBMAP(true, !LOOKGBMAP)',
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
    'LFS3_IFDEF_REPAIR(true, !REPAIRMETA)',
    'LFS3_IFDEF_REPAIR(true, !REPAIRDATA)',
]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // create an interesting filesystem
    uint32_t prng = 42;
    for (lfs3_size_t i = 0; i < N; i++) {
        char name[256];
        sprintf(name, "squid%03x", i);

        uint8_t wbuf[SIZE];
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }

        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_close(&lfs3, &file) => 0;
    }

    // remount to reset flags
    lfs3_unmount(&lfs3) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // check that flags were reset
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP
                        && (fsinfo.flags
                            & LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)))
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // run gc
    if (AFTER == 0) {
        #ifdef LFS3_GC
        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0);
        #else
        assert(false);
        #endif

    // run lfs3_gc_t
    } else if (AFTER == 1) {
        lfs3_gc_t gc;
        lfs3_gc_open(&lfs3, &gc, GC_FLAGS) => 0;
        while (true) {
            lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
            assert(steps >= 0);
            if (steps == 0) {
                break;
            }
        }
        lfs3_gc_close(&lfs3, &gc) => 0;

    // run explicit operations
    //
    // yes, doing these in separate traversals is inefficient, I don't care
    } else if (AFTER == 2) {
        while (true) {
            // it may take multiple traversals to do all pending work
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            if (!(fsinfo.flags & (
                    ((MKCONSISTENT) ? LFS3_I_MKCONSISTENT : 0)
                        | ((LOOKAHEAD) ? LFS3_I_LOOKAHEAD : 0)
                        | ((LOOKGBMAP)
                            ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                            : 0)
                        | ((PREERASE)
                            ? LFS3_IFDEF_PREERASE(LFS3_I_PREERASE, -1)
                            : 0)
                        | ((COMPACTMETA) ? LFS3_I_COMPACTMETA : 0)
                        | ((CKMETA) ? LFS3_I_CKMETA : 0)
                        | ((CKDATA) ? LFS3_I_CKDATA : 0)
                        | ((REPAIRMETA)
                            ? LFS3_IFDEF_REPAIR(LFS3_I_REPAIRMETA, -1)
                            : 0)
                        | ((REPAIRDATA)
                            ? LFS3_IFDEF_REPAIR(LFS3_I_REPAIRDATA, -1)
                            : 0)))) {
                break;
            }

            if (MKCONSISTENT && (fsinfo.flags & LFS3_I_MKCONSISTENT)) {
                lfs3_fs_mkconsistent(&lfs3) => 0;
            }

            if (LOOKAHEAD && (fsinfo.flags & LFS3_I_LOOKAHEAD)) {
                lfs3_gc_t gc;
                lfs3_gc_open(&lfs3, &gc, LFS3_GC_LOOKAHEAD) => 0;
                lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, -1);
                assert(steps >= 0);
                lfs3_gc_close(&lfs3, &gc) => 0;
            }

            #ifdef LFS3_GBMAP
            if (LOOKGBMAP && (fsinfo.flags & LFS3_I_LOOKGBMAP)) {
                lfs3_gc_t gc;
                lfs3_gc_open(&lfs3, &gc, LFS3_GC_LOOKGBMAP) => 0;
                lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, -1);
                assert(steps >= 0);
                lfs3_gc_close(&lfs3, &gc) => 0;
            }
            #endif

            #ifdef LFS3_PREERASE
            if (PREERASE && (fsinfo.flags & LFS3_I_PREERASE)) {
                lfs3_gc_t gc;
                lfs3_gc_open(&lfs3, &gc, LFS3_GC_PREERASE) => 0;
                lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, -1);
                assert(steps >= 0);
                lfs3_gc_close(&lfs3, &gc) => 0;
            }
            #endif

            if (COMPACTMETA && (fsinfo.flags & LFS3_I_COMPACTMETA)) {
                lfs3_gc_t gc;
                lfs3_gc_open(&lfs3, &gc, LFS3_GC_COMPACTMETA) => 0;
                lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, -1);
                assert(steps >= 0);
                lfs3_gc_close(&lfs3, &gc) => 0;
            }

            if (CKMETA && (fsinfo.flags & LFS3_I_CKMETA)) {
                lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;
            }

            if (CKDATA && (fsinfo.flags & LFS3_I_CKDATA)) {
                lfs3_fs_ck(&lfs3, LFS3_CK_CKDATA) => 0;
            }

            #ifdef LFS3_REPAIR
            if (REPAIRMETA && (fsinfo.flags & LFS3_I_REPAIRMETA)) {
                lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
            }
            #endif

            #ifdef LFS3_REPAIR
            if (REPAIRDATA && (fsinfo.flags & LFS3_I_REPAIRDATA)) {
                lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRDATA) => 0;
            }
            #endif
        }

    // remount with gc flags
    } else if (AFTER == 3) {
        lfs3_unmount(&lfs3) => 0;
        lfs3_mount(&lfs3, LFS3_M_RDWR | GC_FLAGS, CFG) => 0;

    } else {
        assert(false);
    }

    // did these clear the right flags?
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!LOOKAHEAD && !GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((!LOOKGBMAP
                        && GBMAP
                        && (fsinfo.flags
                            & LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)))
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE(
                    (GBMAP && !PREERASE) ? LFS3_I_PREERASE : 0,
                    0)
                | ((!COMPACTMETA) ? LFS3_I_COMPACTMETA : 0)
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    lfs3_unmount(&lfs3) => 0;
'''

