# test compacting traversals

# test traversals with mdir compaction

[cases.test_gc_t_compact]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = 'FCACHE_SIZE/2'
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mdir until >gc_compact_thresh full
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // hack, but we want to make sure LFS3_I_COMPACTMETA is set
    // correctly
    lfs3.flags &= ~LFS3_I_COMPACTMETA;

    // hack, don't use the internals like this
    uint8_t wbuf[SIZE];
    while ((file.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // we should be marked as uncompacted
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // try gcing and compacting
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc,
            LFS3_GC_COMPACTMETA
                | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
                | ((CKMETA) ? LFS3_GC_CKMETA : 0)
                | ((CKDATA) ? LFS3_GC_CKDATA : 0)) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

    // mdir should have been compacted
    assert((file.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH);

    // uncompacted flag should have been cleared
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!LOOKAHEAD && !GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_gc_t_compact_mrootanchor]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = 'FCACHE_SIZE/2'
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
# force early relocations, but keep at least 1 to prevent mroot anchor
# from extendeding during compaction
defines.BLOCK_RECYCLES = 1
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mdir until mroot extends
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    uint8_t wbuf[SIZE];
    while (lfs3.mroot.r.blocks[0] == 0
            || lfs3.mroot.r.blocks[0] == 1) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // hack, but we want to make sure LFS3_I_COMPACTMETA is set
    // correctly
    lfs3.flags &= ~LFS3_I_COMPACTMETA;

    // now write to our mdir until mrootanchor >gc_compact_thresh full
    while (true) {
        // we need internals to check this
        lfs3_mdir_t mrootanchor;
        lfs3_mdir_fetch(&lfs3, &mrootanchor,
                -1, (const lfs3_block_t[]){0, 1}) => 0;
        if (lfs3_rbyd_eoff(&mrootanchor.r) > GC_COMPACTMETA_THRESH) {
            break;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // we should be marked as uncompacted
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // try gcing and compacting
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc,
            LFS3_GC_COMPACTMETA
                | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
                | ((CKMETA) ? LFS3_GC_CKMETA : 0)
                | ((CKDATA) ? LFS3_GC_CKDATA : 0)) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

    // mrootanchor should have been compacted
    lfs3_mdir_t mrootanchor;
    lfs3_mdir_fetch(&lfs3, &mrootanchor,
            -1, (const lfs3_block_t[]){0, 1}) => 0;
    assert(lfs3_rbyd_eoff(&mrootanchor.r) <= GC_COMPACTMETA_THRESH);

    // uncompacted flag should have been cleared
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!LOOKAHEAD && !GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                // note ckdata implies ckmeta
                | ((!CKMETA && !CKDATA) ? LFS3_I_CKMETA : 0)
                | ((!CKDATA) ? LFS3_I_CKDATA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)));

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
