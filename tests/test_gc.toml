        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                TEST_PRNG(&prng);
            }
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }

        lfs3_file_rewind(&lfs3, &file2) => 0;
        for (lfs3_off_t i = 0; i < wsize/2; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &file2, rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_file_close(&lfs3, &file2) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

