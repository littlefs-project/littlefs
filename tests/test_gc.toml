[cases.test_gc_t_compact_btree_mtree_mtree]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.SIZE = 'FCACHE_SIZE/2'
defines.SMACK = 20
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
# force early relocations
defines.BLOCK_RECYCLES = 0
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create two files
    lfs3_file_t file1;
    lfs3_file_open(&lfs3, &file1, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf1[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file1) => 0;

    lfs3_file_t file2;
    lfs3_file_open(&lfs3, &file2, "octopus",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf2[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file2, wbuf2, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file2) => 0;

    // hack, but we want to make sure LFS3_I_COMPACTMETA is set
    // correctly
    lfs3.flags &= ~LFS3_I_COMPACTMETA;

    // create more files until we have 2 btree nodes
    // >gc_compact_thresh full
    lfs3_size_t i = 0;
    while (true) {
        // >2 btree nodes >gc_compact_thresh full?
        lfs3_size_t full = 0;
        lfs3_trv_t trv;
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        for (lfs3_block_t i = 0;; i++) {
            assert(i < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }

            if (binfo.btype == LFS3_BTYPE_BTREE) {
                // hack, don't use the internals like this
                lfs3_rbyd_t rbyd;
                lfs3_rbyd_fetch(&lfs3, &rbyd, binfo.block, -1,
                        LFS3_RBYD_RELAX) => 0;
                if (lfs3_rbyd_eoff(&rbyd) >= GC_COMPACTMETA_THRESH) {
                    full += 1;
