# test that repairdata doesn't miss damage introduced during traversal
[cases.test_gc_repairdata_damaged]
defines.GC_FLAGS = 'LFS3_GC_REPAIRDATA'
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
ifdef = ['LFS3_GC', 'LFS3_REPAIR']
# we need data blocks here
if = 'SIZE >= BLOCK_SIZE'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "squid",
            LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_close(&lfs3, &file) => 0;

    // damage a random block
    lfs3_ssize_t n = lfs3_fs_size(&lfs3);
    assert(n >= 0);
    lfs3_block_t victim_i = lfs3_emubd_prng(CFG) % lfs3_max(n, 1);
    lfs3_block_t victim = -1;
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        // only consider data blocks
        if ((i <= victim_i || victim == (lfs3_block_t)-1)
                && binfo.btype == LFS3_BTYPE_DATA) {
            victim = binfo.block;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // make bad
    assert(victim != (lfs3_block_t)-1);
    lfs3_emubd_mkbad(CFG, victim) => 0;

    // read the file to set the repair flag
    lfs3_file_open(&lfs3, &file, "squid", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_REPAIRDATA);

    // run GC one step
    lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
    assert(steps >= 0);
    assert(lfs3.gc.wflags & LFS3_gc_EVICTDATA);

    // damage a block that's unlikely to be in use
    lfs3_block_t victim_ = BLOCK_COUNT-1;
    assert(victim_ != victim);
    lfs3_emubd_mkbad(CFG, victim_) => 0;

    // bit of a hack, but force a read to detect the damaged block
    uint8_t dbuf[READ_SIZE];
    lfs3_bd_read__(&lfs3, victim_, 0, dbuf, READ_SIZE, LFS3_BD_DATA) => 0;

    // this one is a bit tricky, when damaged, our mgc logic immediately
    // aborts and restarts repairs with the highest priority, so we
    // can't wait for a traversal to finish like in other tests
    //
    // but we can at least check that the traversal restarts at the
    // mrootanchor after one step

    // run GC one step
    steps = lfs3_fs_gc(&lfs3);
    assert(steps >= 0);
    assert(lfs3.gc.wflags & LFS3_gc_EVICTDATA);

    // restarted at mrootanchor?
    assert(lfs3_mdir_ismrootanchor(&lfs3.gc.t.h.mdir));

    // run GC until our traversal is done
    while (lfs3.gc.wflags & LFS3_gc_EVICTDATA) {
        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0);
    }

    // because we aborted, we should make progress
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_REPAIRDATA));

    // check the file contents
    lfs3_file_open(&lfs3, &file, "squid", LFS3_O_RDONLY) => 0;
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
'''


