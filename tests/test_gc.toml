        | ((REPAIRMETA) ? LFS3_IFDEF_REPAIR(LFS3_GC_REPAIRMETA, -1) : 0)
        | ((REPAIRDATA) ? LFS3_IFDEF_REPAIR(LFS3_GC_REPAIRDATA, -1) : 0)
'''
# DON'T test with GC_STEPS=-1, it may never terminate!
defines.GC_STEPS = [1, 2, 10, 100, 1000]
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
# note preerasing needs revperturb
defines.REV_FLAGS = '''
    ((PREERASE) ? LFS3_IFDEF_PREERASE(LFS3_REV_REVPERTURB, -1) : 0)
'''
defines.SIZE = 'BLOCK_SIZE'
if = [
    'LFS3_IFDEF_GBMAP(true, !LOOKGBMAP)',
    'LFS3_IFDEF_PREERASE(true, !PREERASE)',
    'GBMAP || !PREERASE',
    'LFS3_IFDEF_REPAIR(true, !REPAIRMETA)',
    'LFS3_IFDEF_REPAIR(true, !REPAIRDATA)',
]
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    for (uint32_t i = 0;; i++) {
        // create a new file every gc cycle
        lfs3_file_t file;
        char name[256];
        sprintf(name, "purseweb%03x", i);
        int err = lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (err == LFS3_ERR_NOSPC) {
            break;
        }
        uint8_t wbuf[SIZE];
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_ssize_t d = lfs3_file_write(&lfs3, &file, wbuf, SIZE);
        assert(d == SIZE || d == LFS3_ERR_NOSPC);
        if (d == LFS3_ERR_NOSPC) {
            lfs3_file_close(&lfs3, &file) => 0;
            break;
        }
        err = lfs3_file_close(&lfs3, &file);
        assert(!err || err == LFS3_ERR_NOSPC);
        if (err == LFS3_ERR_NOSPC) {
            break;
        }

        // gc!
        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0 || steps == LFS3_ERR_NOSPC);
        if (steps == LFS3_ERR_NOSPC) {
            break;
        }
    }

    // check the contents of the files that were written
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
        }

        // reset prng
        uint32_t prng = 42;

        // try to read
        for (uint32_t i = 0;; i++) {
            lfs3_file_t file;
            char name[256];
            sprintf(name, "purseweb%03x", i);
            int err = lfs3_file_open(&lfs3, &file, name, LFS3_O_RDONLY);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }

            uint8_t wbuf[SIZE];
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[SIZE];
            lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
            assert(memcmp(rbuf, wbuf, SIZE) == 0);
            lfs3_file_close(&lfs3, &file) => 0;
        }
    }

    lfs3_unmount(&lfs3) => 0;
'''



