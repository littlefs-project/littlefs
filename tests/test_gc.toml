# test that as we increase gc_preerase_count, late-erases generally
# decreases
[cases.test_gc_preerase_decreasing]
# this is just the starting gc_preerase_count
defines.GC_PREERASE_COUNT = 1
defines.GC_PREERASE_STEP = 10
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        // note we need lookgbmap for this test to be reliable
        | LFS3_GC_LOOKGBMAP
        | LFS3_GC_PREERASE
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
# note preerasing needs revperturb
defines.REV_FLAGS = 'LFS3_REV_REVPERTURB'
defines.SIZE = 'BLOCK_SIZE'
if = 'GBMAP'
ifdef = ['LFS3_GC', 'LFS3_GBMAP', 'LFS3_REVPERTURB', 'LFS3_PREERASE']
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, CFG) => 0;

    uint32_t prng = 42;

    // keep track of non-preerase erase cycles
    lfs3_emubd_io_t *erased = malloc(sizeof(lfs3_emubd_io_t)*BLOCK_COUNT);
    memset(erased, 0, sizeof(lfs3_emubd_io_t)*BLOCK_COUNT);

    // step through preerase counts
    for (lfs3_size_t i = 0; i < BLOCK_COUNT/GC_PREERASE_STEP; i++) {
        // reconfigure the preerase count per run
        struct lfs3_cfg cfg = *CFG;
        cfg.gc_preerase_count = GC_PREERASE_COUNT + i*GC_PREERASE_STEP;
        lfs3_mount(&lfs3, LFS3_M_RDWR, &cfg) => 0;

        // run GC until we make progress
        for (lfs3_block_t i = 0;; i++) {
            // a bit hacky, but this catches infinite loops
            LFS3_ASSERT(i < 2*BLOCK_COUNT);

            lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
            assert(steps >= 0);

            struct lfs3_fsinfo fsinfo;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            if (!(fsinfo.flags & LFS3_I_PREERASE)) {
                break;
            }
        }

        // measure erased cycles before
        lfs3_emubd_io_t erased_ = lfs3_emubd_erased(&cfg);

        // rewrite file disk number of times
        lfs3_file_t file;
        uint8_t wbuf[SIZE];
        for (lfs3_block_t i = 0; i < BLOCK_COUNT; i++) {
            lfs3_file_open(&lfs3, &file, "spider",
                    LFS3_O_WRONLY
                        | LFS3_O_CREAT
                        | LFS3_O_TRUNC) => 0;
            for (lfs3_size_t j = 0; j < SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
            lfs3_file_close(&lfs3, &file) => 0;

            // we should always need to either preerase or lookahead after
            // any block allocation
            struct lfs3_fsinfo fsinfo;
            lfs3_fs_stat(&lfs3, &fsinfo) => 0;
            assert((fsinfo.flags & LFS3_I_PREERASE)
                    || (fsinfo.flags & LFS3_I_LOOKGBMAP));
        }

        // check the file contents
        lfs3_file_open(&lfs3, &file, "spider", LFS3_O_RDONLY) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
        lfs3_file_close(&lfs3, &file) => 0;

        // measure erased cycles after
        lfs3_emubd_io_t erased__ = lfs3_emubd_erased(&cfg);
        erased[i] = erased__ - erased_;
        // log just in case it's useful when debugging
        printf("after %d cycles: pre-erased %d, late-erased %d\n",
                (int32_t)BLOCK_COUNT,
                cfg.gc_preerase_count,
                (int32_t)((erased__ - erased_)/BLOCK_SIZE));

        lfs3_unmount(&lfs3) => 0;
    }

    // compute deltas
    lfs3_size_t best_i = 0;
    lfs3_ssize_t best_delta = 0;
    lfs3_size_t worst_i = 0;
    lfs3_ssize_t worst_delta = 0;
    lfs3_ssize_t sum_delta = 0;
    for (lfs3_size_t i = 0; i < (BLOCK_COUNT/GC_PREERASE_STEP)-1; i++) {
        printf("delta: pre-erased %d->%d, late-erased %d->%d (%+d)\n",
                (int32_t)(GC_PREERASE_COUNT + (i+0)*GC_PREERASE_STEP),
                (int32_t)(GC_PREERASE_COUNT + (i+1)*GC_PREERASE_STEP),
                (int32_t)(erased[i+0]/BLOCK_SIZE),
                (int32_t)(erased[i+1]/BLOCK_SIZE),
                (int32_t)((erased[i+1] - erased[i])/BLOCK_SIZE));
        lfs3_ssize_t delta = (erased[i+1] - erased[i])/BLOCK_SIZE;
        if (i == 0 || delta < best_delta) {
            best_i = i;
            best_delta = delta;
        }
        if (i == 0 || delta > worst_delta) {
            worst_i = i;
            worst_delta = delta;
        }
        sum_delta += delta;
    }
    lfs3_ssize_t avg_delta = sum_delta / ((BLOCK_COUNT/GC_PREERASE_STEP)-1);

    printf("best delta: %+d (%d->%d)\n",
            best_delta,
            (int32_t)(GC_PREERASE_COUNT + (best_i+0)*GC_PREERASE_STEP),
            (int32_t)(GC_PREERASE_COUNT + (best_i+1)*GC_PREERASE_STEP));
    printf("worst delta: %+d (%d->%d)\n",
            worst_delta,
            (int32_t)(GC_PREERASE_COUNT + (worst_i+0)*GC_PREERASE_STEP),
            (int32_t)(GC_PREERASE_COUNT + (worst_i+1)*GC_PREERASE_STEP));
    printf("avg delta: %+d (%d/%d)\n",
            avg_delta,
            sum_delta,
            (int32_t)((BLOCK_COUNT/GC_PREERASE_STEP)-1));

    // we should expect deltas to average out to ~-GC_PREERASE_STEP,
    // hopefully no worse than -0.75*GC_PREERASE_STEP
    assert(avg_delta < -(GC_PREERASE_STEP-GC_PREERASE_STEP/4));

    free(erased);
'''


# test that compact can make progress in isolation
[cases.test_gc_compact_progress]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    LFS3_GC_COMPACTMETA
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
defines.GC_STEPS = [-1, 1, 2, 10, 100, 1000]
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
ifdef = 'LFS3_GC'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mdir until >gc_compact_thresh full
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // hack, don't use the internals like this
    uint8_t wbuf[SIZE];
    while ((file.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_COMPACTMETA);

    // run GC until we make progress
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        LFS3_ASSERT(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0);

        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        if (!(fsinfo.flags & LFS3_I_COMPACTMETA)) {
            break;
        }
    }

    // mdir should have been compacted
    assert((file.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH);

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test that compact dirtying still works with the GC API
[cases.test_gc_compact_mutation]
defines.LOOKAHEAD = [false, true]
defines.CKMETA = [false, true]
defines.CKDATA = [false, true]
defines.GC_FLAGS = '''
    LFS3_GC_COMPACTMETA
        | ((LOOKAHEAD) ? LFS3_GC_LOOKAHEAD : 0)
        | ((CKMETA) ? LFS3_GC_CKMETA : 0)
        | ((CKDATA) ? LFS3_GC_CKDATA : 0)
'''
# set compact thresh to minimum
defines.GC_COMPACTMETA_THRESH = 'BLOCK_SIZE/2'
# LFS3_GC_COMPACTMETA and LFS3_GC_LOOKAHEAD can end up competing, so
# gives ourselves a bit of wiggle room, this is a more realistic value
# anyways
defines.GC_LOOKGBMAP_THRESH = '(BLOCK_COUNT*3)/4'
defines.SIZE = [
    'FCACHE_SIZE/2',
    '2*FCACHE_SIZE',
    'BLOCK_SIZE/2',
    'BLOCK_SIZE',
    '2*BLOCK_SIZE',
    '8*BLOCK_SIZE',
]
# we need something to keep the traversal running
if = 'CKMETA || CKDATA'
ifdef = 'LFS3_GC'
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mdir until >gc_compact_thresh full
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // hack, don't use the internals like this
    uint8_t wbuf[SIZE];
    while ((file.h.mdir.r.eoff & 0x7fffffff) <= GC_COMPACTMETA_THRESH) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // expect dirty initial state or else our test doesn't work
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_COMPACTMETA);
    lfs3.gc.wflags = 0;

    // run GC one traversal + until compacting
    while (true) {
        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0);

        if (!(lfs3.gc.wflags & LFS3_GC_COMPACTMETA)) {
            break;
        }
    }
    while (true) {
        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0);

        if (lfs3.gc.wflags & LFS3_GC_COMPACTMETA) {
            break;
        }
    }

    // mutate the filesystem
    lfs3_file_rewind(&lfs3, &file) => 0;
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file) => 0;

    // run GC until our traversal is done (twice for compact)
    while (lfs3.gc.wflags & LFS3_GC_COMPACTMETA) {
        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0);
    }

    // we should _not_ make progress
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags & LFS3_I_COMPACTMETA);

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
