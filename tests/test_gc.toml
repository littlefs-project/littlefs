    assert(fsinfo.flags == (
            ((ORPHANS > 0) ? LFS3_I_MKNOGRM : 0)
                | ((ORPHANS >= 3) ? LFS3_I_MKNOORPHANNOTES : 0)
                | ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1) : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                | ((ORPHANS >= 3) ? LFS3_I_GRMOVERFLOW : 0)));

