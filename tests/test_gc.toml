    steps = lfs3_fs_gc(&lfs3);
    assert(steps >= 0);
    assert(lfs3.gc.wflags & LFS3_gc_EVICTMETA);

    // restarted at mrootanchor?
    assert(lfs3_mdir_ismrootanchor(&lfs3.gc.t.h.mdir));

    // run GC until our traversal is done
    while (lfs3.gc.wflags & (LFS3_GC_CKMETA | LFS3_gc_EVICTMETA)) {
        lfs3_sblock_t steps = lfs3_fs_gc(&lfs3);
        assert(steps >= 0);
    }

    // because we aborted, we should make progress
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(!(fsinfo.flags & LFS3_I_REPAIRMETA));

    // check the file contents
    lfs3_file_open(&lfs3, &file, "squid", LFS3_O_RDONLY) => 0;
    uint8_t rbuf[SIZE];
    lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
    assert(memcmp(rbuf, wbuf, SIZE) == 0);
    lfs3_file_close(&lfs3, &file) => 0;

    lfs3_unmount(&lfs3) => 0;
