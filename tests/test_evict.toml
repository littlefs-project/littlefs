    lfs3_block_t n = 0;

    // set up a simulation to compare against
    lfs3_size_t *sim = malloc(N*sizeof(lfs3_size_t));
    lfs3_size_t sim_size = 0;

    uint32_t prng = SEED;
    for (lfs3_size_t i = 0; i < OPS; i++) {
        // choose a pseudo-random op, either mkdir, remove, or rename
        uint8_t op = TEST_PRNG(&prng) % 3;

        if (op == 0 || sim_size == 0) {
            // choose a pseudo-random number, truncate to 3 hexadecimals
            lfs3_size_t x = TEST_PRNG(&prng) % N;
            // insert into our sim
            for (lfs3_size_t j = 0;; j++) {
                if (j >= sim_size || sim[j] >= x) {
                    // already seen?
                    if (j < sim_size && sim[j] == x) {
                        // do nothing
                    } else {
                        // insert
                        memmove(&sim[j+1], &sim[j],
                                (sim_size-j)*sizeof(lfs3_size_t));
                        sim_size += 1;
                        sim[j] = x;
                    }
                    break;
                }
            }

            // create a directory here
            char name[256];
            sprintf(name, "dir%03x", x);
            int err = lfs3_mkdir(&lfs3, name);
            assert(!err || err == LFS3_ERR_EXIST);

        } else if (op == 1) {
            // choose a pseudo-random entry to delete
            lfs3_size_t j = TEST_PRNG(&prng) % sim_size;
            lfs3_size_t x = sim[j];
            // delete from our sim
            memmove(&sim[j], &sim[j+1],
                    (sim_size-(j+1))*sizeof(lfs3_size_t));
            sim_size -= 1;

            // remove this directory
            char name[256];
            sprintf(name, "dir%03x", x);
            lfs3_remove(&lfs3, name) => 0;

        } else {
            // choose a pseudo-random entry to rename, and a pseudo-random
            // number to rename to
            lfs3_size_t j = TEST_PRNG(&prng) % sim_size;
            lfs3_size_t x = sim[j];
            lfs3_size_t y = TEST_PRNG(&prng) % N;
            for (lfs3_size_t k = 0;; k++) {
                if (k >= sim_size || sim[k] >= y) {
                    // already seen and not a noop?
                    if (k < sim_size && sim[k] == y && x != y) {
                        // just delete the original entry
                        memmove(&sim[j], &sim[j+1],
                                (sim_size-(j+1))*sizeof(lfs3_size_t));
                        sim_size -= 1;
                    } else {
                        // first delete
                        memmove(&sim[j], &sim[j+1],
                                (sim_size-(j+1))*sizeof(lfs3_size_t));
                        if (k > j) {
                            k -= 1;
                        }
                        // then insert
                        memmove(&sim[k+1], &sim[k],
                                (sim_size-1-k)*sizeof(lfs3_size_t));
                        sim[k] = y;
                    }
                    break;
                }
            }

            // rename this directory
            char old_name[256];
            sprintf(old_name, "dir%03x", x);
            char new_name[256];
            sprintf(new_name, "dir%03x", y);
            lfs3_rename(&lfs3, old_name, new_name) => 0;
        }

        // damage a random block
        //
        // to try to minimize traversals we randomly choose a block
        // based on the _previous_ traversal
        lfs3_block_t victim_i = lfs3_emubd_prng(CFG) % lfs3_max(n, 1);
        lfs3_block_t victim = 0;
        lfs3_trv_t trv;
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        for (lfs3_block_t i = 0;; i++) {
            assert(i < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }

            if (i <= victim_i) {
                victim = binfo.block;
            }
            n = i+1;
        }
        lfs3_trv_close(&lfs3, &trv) => 0;

        // make bad
        lfs3_emubd_mkbad(CFG, victim) => 0;
        // request ck flags
        lfs3_fs_requestck(&lfs3, LFS3_GC_CK) => 0;

        // run gc to repair bad blocks
        lfs3_gc_t gc;
        lfs3_gc_open(&lfs3, &gc, LFS3_GC_CK | LFS3_GC_REPAIR) => 0;
        for (lfs3_block_t i = 0;; i++) {
            // a bit hacky, but this catches infinite loops
            assert(i < 2*BLOCK_COUNT);

            lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
            assert(steps >= 0);
            if (steps == 0) {
                break;
            }
        }
        lfs3_gc_close(&lfs3, &gc) => 0;

        // make the block good again
        lfs3_emubd_mkgood(CFG, victim) => 0;

        // evicted block should no longer be in use, anywhere in the
        // filesystem
        lfs3_trv_open(&lfs3, &trv, 0) => 0;
        for (lfs3_block_t i = 0;; i++) {
            assert(i < 2*BLOCK_COUNT);

            struct lfs3_binfo binfo;
            int err = lfs3_trv_read(&lfs3, &trv, &binfo);
            assert(!err || err == LFS3_ERR_NOENT);
            if (err == LFS3_ERR_NOENT) {
                break;
            }

            // hmm, ignore the mrootanchor, which we _can_ repair, but
            // not evict
            if (binfo.block != 0
                    && binfo.block != 1
                    // hmm, and the mdir's spare blocks, these don't
                    // actually store anything at rest
                    && !(binfo.btype == LFS3_BTYPE_MDIR
                        && trv.blocks[0] == -1)) {
                assert(binfo.block != victim);
            }
        }
        lfs3_trv_close(&lfs3, &trv) => 0;
    }

    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDONLY, CFG) => 0;
        }

        // grm should be zero here
        assert(lfs3.grm_p[0] == 0);

        // test that our directories match our simulation
        for (lfs3_size_t j = 0; j < sim_size; j++) {
            char name[256];
            sprintf(name, "dir%03x", sim[j]);
            struct lfs3_info info;
            lfs3_stat(&lfs3, name, &info) => 0;
            char name2[256];
            sprintf(name2, "dir%03x", sim[j]);
            assert(strcmp(info.name, name2) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
        }

        lfs3_dir_t dir;
        lfs3_dir_open(&lfs3, &dir, "/") => 0;
        struct lfs3_info info;
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, ".") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        lfs3_dir_read(&lfs3, &dir, &info) => 0;
        assert(strcmp(info.name, "..") == 0);
        assert(info.type == LFS3_TYPE_DIR);
        assert(info.size == 0);
        for (lfs3_size_t j = 0; j < sim_size; j++) {
            char name[256];
            sprintf(name, "dir%03x", sim[j]);
            lfs3_dir_read(&lfs3, &dir, &info) => 0;
            assert(strcmp(info.name, name) == 0);
            assert(info.type == LFS3_TYPE_DIR);
            assert(info.size == 0);
        }
        lfs3_dir_read(&lfs3, &dir, &info) => LFS3_ERR_NOENT;
        lfs3_dir_close(&lfs3, &dir) => 0;
    }

    // clean up sim/lfs3
    free(sim);
    lfs3_unmount(&lfs3) => 0;
'''

