[cases.test_evict_repair_t_btree_mtree_mtree]
defines.SIZE = 'FCACHE_SIZE/2'
defines.SMACK = 20
defines.SIBLING = [0, 1, 2]
# force early relocations
defines.BLOCK_RECYCLES = 0
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
defines.CONDEMN = [false, true]
defines.DAMAGE_FLAGS = '''
    ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_DAMAGE_CONDEMNDAMAGE, -1) : 0)
