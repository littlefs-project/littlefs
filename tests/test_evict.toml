        prng = wprng;
        for (lfs3_size_t i = 0; i < wsize_; i += 1) {
            TEST_PRNG(&prng);
        }
        lfs3_file_seek(&lfs3, &files[k], 0, LFS3_SEEK_END) => wsize_;
        uint8_t wbuf[BLOCK_SIZE];
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
