# test evicting a dag block
[cases.test_evict_t_bptr_dag]
defines.SYNC = [false, true]
defines.CLOSE = [false, true]
defines.CONDEMN = [false, true]
if = 'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write a block
    uint8_t wbuf[BLOCK_SIZE];
    for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE) => BLOCK_SIZE;
    lfs3_file_flush(&lfs3, &file) => 0;
    // write a single byte in the middle of the block, forcing a dag
    wbuf[BLOCK_SIZE/2] = '!';
    lfs3_file_seek(&lfs3, &file, BLOCK_SIZE/2, LFS3_SEEK_SET)
            => BLOCK_SIZE/2;
    lfs3_file_write(&lfs3, &file, &wbuf[BLOCK_SIZE/2], 1) => 1;
    lfs3_file_flush(&lfs3, &file) => 0;
    // sync?
    if (SYNC) {
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // read to get the bptr back in our leaf
    uint8_t rbuf[BLOCK_SIZE];
    lfs3_file_seek(&lfs3, &file, -1, LFS3_SEEK_END) => BLOCK_SIZE-1;
    lfs3_file_read(&lfs3, &file, rbuf, 1) => 1;

    // close during eviction? this makes sure eviction can find the
    // btree on disk
    if (CLOSE) {
        lfs3_file_close(&lfs3, &file) => 0;
    }

    // get a block to evict
    lfs3_block_t victim = file.leaf.bptr.d.u.disk.block;

    // this block should be in use, twice! because it's a dag
    lfs3_trv_t trv;
    lfs3_size_t count = 0;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        if (binfo.btype == LFS3_BTYPE_DATA) {
            assert(binfo.block == victim);
            count += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;
    assert(count == 2);

    // try evicting
    lfs3_fs_evictblock(&lfs3, victim,
            LFS3_EVICT_EVICT
                | ((CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_EVICT_BAD, -1)
                    : 0)) => 0;

    // reopen if necessary
    if (CLOSE) {
        lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDWR) => 0;
    }

    // evicted block should no longer be in use
    assert(file.leaf.bptr.d.u.disk.block != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    // but we should still only have one block in use, twice, because
    // it's a dag
    lfs3_block_t block = 0;
    count = 0;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        if (binfo.btype == LFS3_BTYPE_DATA) {
            assert(!block || binfo.block == block);
            count += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;
    assert(count == 2);

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
        assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test evicting a partially erased block
#
# Well, we can't use erased state in evicted blocks, but we shouldn't
# explode or anything
#
[cases.test_evict_t_bptr_erased]
defines.SYNC = [false, true]
defines.CONDEMN = [false, true]
if = [
    # is half a block prog aligned?
    '(BLOCK_SIZE/2) % PROG_SIZE == 0',
    'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)',
]
in = 'lfs3.c'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write half a block
    uint8_t wbuf[BLOCK_SIZE];
    for (lfs3_size_t j = 0; j < BLOCK_SIZE/2; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE/2) => BLOCK_SIZE/2;
    lfs3_file_flush(&lfs3, &file) => 0;
    // sync?
    if (SYNC) {
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // get a block to evict
    lfs3_block_t victim = file.leaf.bptr.d.u.disk.block;

    // this block should be in use
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err);

        if (binfo.block == victim) {
            assert(binfo.btype == LFS3_BTYPE_DATA);
            break;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // the block should be marked as erased
    assert(lfs3_bptr_iserased(&file.leaf.bptr));

    // try evicting
    lfs3_fs_evictblock(&lfs3, victim,
            LFS3_EVICT_EVICT
                | ((CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_EVICT_BAD, -1)
                    : 0)) => 0;

    // evicted block should no longer be in use
    assert(file.leaf.bptr.d.u.disk.block != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    // we should no longer be marked as erased
    assert(file.leaf.bptr.d.u.disk.block == 0
            || !lfs3_bptr_iserased(&file.leaf.bptr));

    // check we can still read the file
    uint8_t rbuf[BLOCK_SIZE];
    lfs3_file_rewind(&lfs3, &file) => 0;
    lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE/2;
    assert(memcmp(rbuf, wbuf, BLOCK_SIZE/2) == 0);

    // finish writing the block to try to make sure nothing is funky
    for (lfs3_size_t j = 0; j < BLOCK_SIZE/2; j++) {
        wbuf[(BLOCK_SIZE/2)+j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file,
            &wbuf[BLOCK_SIZE/2], BLOCK_SIZE/2) => BLOCK_SIZE/2;
    lfs3_file_flush(&lfs3, &file) => 0;
    // sync?
    if (SYNC) {
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
        assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

# test bshrubs with evicted bptrs are broadcast correctly
[cases.test_evict_t_bptr_broadcast]
defines.SIZE = [
    '1*BLOCK_SIZE', '2*BLOCK_SIZE', '3*BLOCK_SIZE', '4*BLOCK_SIZE'
]
defines.HANDLESET = 'range(0x8)'
defines.SIBLING = [0, 1, 2, 3]
defines.CONDEMN = [false, true]
if = [
    'SIBLING < SIZE/BLOCK_SIZE',
    'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)',
]
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write n blocks
    uint32_t wprng = prng;
    lfs3_off_t wsize = 0;
    while (wsize < SIZE) {
        uint8_t wbuf[BLOCK_SIZE];
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE) => BLOCK_SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
        wsize += BLOCK_SIZE;
    }

    // open a couple other handles in different states
    lfs3_file_t file_mutated;
    if (HANDLESET & 0x1) {
        lfs3_file_open(&lfs3, &file_mutated, "jellyfish", LFS3_O_RDWR) => 0;
        lfs3_file_write(&lfs3, &file_mutated, "!", 1) => 1;
        lfs3_file_flush(&lfs3, &file_mutated) => 0;
    }

    lfs3_file_t file_desync;
    if (HANDLESET & 0x2) {
        lfs3_file_open(&lfs3, &file_desync, "jellyfish",
                LFS3_O_RDWR | LFS3_O_DESYNC) => 0;
    }

    lfs3_file_t file_desync_mutated;
    if (HANDLESET & 0x4) {
        lfs3_file_open(&lfs3, &file_desync_mutated, "jellyfish",
                LFS3_O_RDWR | LFS3_O_DESYNC) => 0;
        lfs3_file_write(&lfs3, &file_desync_mutated, "!", 1) => 1;
        lfs3_file_flush(&lfs3, &file_desync_mutated) => 0;
    }

    // get a block to evict
    lfs3_block_t victim = 0;
    lfs3_size_t count = 0;
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err);

        if (binfo.btype == LFS3_BTYPE_DATA) {
            if (count == SIBLING) {
                victim = binfo.block;
                break;
            }

            count += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // try evicting
    lfs3_fs_evictblock(&lfs3, victim,
            LFS3_EVICT_EVICT
                | ((CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_EVICT_BAD, -1)
                    : 0)) => 0;

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
