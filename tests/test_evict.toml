[cases.test_evict_iflags_meta_abort]
# also clear sticky flags
defines.STICKY = [false, true]
defines.SYNC = [false, true]
defines.CLOSE = [false, true]
defines.N = 1
defines.SIZE = 'N*BLOCK_SIZE'
