    lfs3_unmount(&lfs3) => 0;
'''

# test making a block bad and good again
[cases.test_evict_t_bad_good]
defines.SIZE = 'FCACHE_SIZE/2'
defines.SIBLING = [0, 1]
defines.CONDEMN = [true]
# force early relocations, this will cause the mroot anchor to extend
defines.BLOCK_RECYCLES = 0
if = 'GBMAP'
ifdef = 'LFS3_CONDEMN'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mroot until it's not the mrootanchor
    //
    // we can't evict the mrootanchor
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
