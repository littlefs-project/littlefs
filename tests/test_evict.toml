    // did we damage the expected number of blocks? otherwise our test
    // no worky
    assert(damaged == N);

    // try to read the file, this should find the damage
    lfs3_file_rewind(&lfs3, &file) => 0;
    prng = wprng;
    for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
        uint8_t wbuf[BLOCK_SIZE];
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {\
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        uint8_t rbuf[BLOCK_SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
        assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
    }

    // we should have overflowed our evictqueue
    assert(lfs3.evictqueue.count >= EVICTQUEUE_COUNT);

    // after finding damage, LFS3_I_REPAIRDATA should be set
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && (fsinfo.flags & LFS3_I_LOOKGBMAP))
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
