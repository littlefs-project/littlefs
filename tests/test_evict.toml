        assert(lfs3.evictqueue.count == 0);

        // calling repair on its own should do nothing
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling repair with ck should find the damage, but not repair it
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
