                // repairmeta set! not repairdata
                | LFS3_I_REPAIRMETA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                // damaged set!
                | LFS3_I_DAMAGEDREAD
