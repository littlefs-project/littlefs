            ? file1.h.mdir.r.blocks[SIBLING % 2]
            : file2.h.mdir.r.blocks[SIBLING % 2];

    // make bad
    lfs3_emubd_mkbad(CFG, victim) => 0;
    // request ck flags
    lfs3_fs_requestck(&lfs3, LFS3_GC_CKMETA) => 0;

    // run gc to repair bad blocks
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc, LFS3_GC_CKMETA | LFS3_GC_REPAIRMETA) => 0;
    for (lfs3_block_t i = 0;; i++) {
