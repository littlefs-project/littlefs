[cases.test_evict_repair_t_btree_btree_broadcast]
defines.CHUNK = 'BLOCK_SIZE/8'
defines.HANDLESET = 'range(0x8)'
defines.SIBLING = [0]
# prevent block crystallization
defines.CRYSTAL_THRESH = -1
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
defines.CONDEMN = [false, true]
defines.DAMAGE_FLAGS = '''
    ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_DAMAGE_CONDEMNDAMAGE, -1) : 0)
'''
ifdef = 'LFS3_REPAIR'
if = 'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write to our file until we have a btree
    uint32_t wprng = prng;
    lfs3_off_t wsize = 0;
    // hack, don't use the internals like this
    while ((file.bshrub.trunk & 0x80000000)
            || file.bshrub.weight == 0) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        lfs3_file_sync(&lfs3, &file) => 0;
        wsize += CHUNK;
    }

    // open a couple other handles in different states
    lfs3_file_t file_mutated;
    if (HANDLESET & 0x1) {
        lfs3_file_open(&lfs3, &file_mutated, "jellyfish", LFS3_O_RDWR) => 0;
        lfs3_file_write(&lfs3, &file_mutated, "!", 1) => 1;
        lfs3_file_flush(&lfs3, &file_mutated) => 0;
    }

    lfs3_file_t file_desync;
    if (HANDLESET & 0x2) {
        lfs3_file_open(&lfs3, &file_desync, "jellyfish",
                LFS3_O_RDWR | LFS3_O_DESYNC) => 0;
    }

    lfs3_file_t file_desync_mutated;
    if (HANDLESET & 0x4) {
        lfs3_file_open(&lfs3, &file_desync_mutated, "jellyfish",
                LFS3_O_RDWR | LFS3_O_DESYNC) => 0;
        lfs3_file_write(&lfs3, &file_desync_mutated, "!", 1) => 1;
        lfs3_file_flush(&lfs3, &file_desync_mutated) => 0;
    }

    // get a block to evict
    lfs3_block_t victim = file.bshrub.blocks[0];

    // make bad
    lfs3_emubd_mkbad(CFG, victim) => 0;
    // request ck flags
    lfs3_fs_requestck(&lfs3, LFS3_GC_CKMETA) => 0;

    // run gc to repair bad blocks
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc, LFS3_GC_CKMETA | LFS3_GC_REPAIRMETA) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

    // evicted block should no longer be in use
    assert(file.bshrub.blocks[0] != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    if (HANDLESET & 0x1) {
        // file_mutated should still be a different bshrub
        assert(file_mutated.bshrub.blocks[0]
                    != file.bshrub.blocks[0]
                || (file_mutated.bshrub.trunk & 0x7fffffff)
                    != (file.bshrub.trunk & 0x7fffffff));
    }

    if (HANDLESET & 0x2) {
        // file_desync should be the same bshrub, yes we ignore desync
        // here!
        assert(file_desync.bshrub.blocks[0]
                    == file.bshrub.blocks[0]
                && (file_desync.bshrub.trunk & 0x7fffffff)
                    == (file.bshrub.trunk & 0x7fffffff));
    }

    if (HANDLESET & 0x4) {
        // file_desync_mutated should still be a different bshrub
        assert(file_desync_mutated.bshrub.blocks[0]
                    != file.bshrub.blocks[0]
                || (file_desync_mutated.bshrub.trunk & 0x7fffffff)
                    != (file.bshrub.trunk & 0x7fffffff));
    }

    // check we can still read the files
    lfs3_file_rewind(&lfs3, &file) => 0;
    prng = wprng;
    for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        uint8_t rbuf[CHUNK];
        lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
        assert(memcmp(rbuf, wbuf, CHUNK) == 0);
    }

    if (HANDLESET & 0x1) {
        lfs3_file_rewind(&lfs3, &file_mutated) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            if (i == 0) {
                wbuf[0] = '!';
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &file_mutated, rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }
    }

    if (HANDLESET & 0x2) {
        lfs3_file_rewind(&lfs3, &file_desync) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
