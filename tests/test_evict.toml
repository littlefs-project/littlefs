    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_off_t wsize_ = BLOCK_SIZE + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)BLOCK_SIZE) {
            wsize_ += BLOCK_SIZE;
