[cases.test_evict_t_btree_gbmap_p]
defines.CHUNK = 'BLOCK_SIZE'
defines.SIZE = ['1*CHUNK', '3*CHUNK', '20*CHUNK']
defines.CONDEMN = [false, true]
# need to disable shrubs to avoid accidental gbmap syncs
defines.SHRUB_SIZE = -1
if = [
    'GBMAP',
    'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)',
]
ifdef = 'LFS3_GBMAP'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3, LFS3_F_RDWR | LFS3_F_GBMAP, CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create two files
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write to our file
    //
    // we use a really annoying write pattern to try to fragment the gbmap
    uint32_t wprng = prng;
    lfs3_off_t wsize = 0;
    while (wsize < SIZE) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        lfs3_soff_t off = lfs3_file_seek(&lfs3, &file, -CHUNK, LFS3_SEEK_END);
        assert(off >= 0);
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
        wsize += CHUNK;
    }

    // create an unrelated file, as a side effect this commits the gbmap
    // to disk
    lfs3_file_t file3;
    lfs3_file_open(&lfs3, &file3, "cuttlefish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    lfs3_file_close(&lfs3, &file3) => 0;
    assert(lfs3.gbmap.b.blocks[0] == lfs3.gbmap.b_p.blocks[0]);

    // keep track of gbmap_p
    lfs3_btree_t b_p = lfs3.gbmap.b_p;

    // truncate our file to free up space and get rid of all the
    // fragmented gbmap ranges
    lfs3_file_truncate(&lfs3, &file, 0) => 0;
    lfs3_file_seek(&lfs3, &file, 0, LFS3_SEEK_SET) => 0;
    wprng = prng;
    wsize = 0;

    // force a lookgbmap scan, _after_ we truncate
    lfs3.gbmap.known = 0;

    // rewrite our file to force a lookgbmap scan and hopefully compact
    // the gbmap
    //
    // note _write_ triggers lookgbmap scans, but we don't commit the
    // gbmap until _sync_
    //
    // we also need to avoid any mdir commits (open+creat, shrubs, etc)!
    // littlefs is very opportunistic!
    while (lfs3.gbmap.b.blocks[0] == lfs3.gbmap.b_p.blocks[0]) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        wsize += CHUNK;
        // don't sync!

        // keep forcing lookgbmap scans, may take a few tries until root
        // relocates
        lfs3.gbmap.known = 0;
    }

    // at this point, gbmap and gbmap_p should differ, with gbmap
    // compacted and gbmap_p uncompacted
    assert(lfs3.gbmap.b.blocks[0] != lfs3.gbmap.b_p.blocks[0]);
    assert(lfs3.gbmap.b_p.blocks[0] == b_p.blocks[0]);

    // get a block to evict
    lfs3_block_t victim = lfs3.gbmap.b_p.blocks[0];

    // try evicting
    lfs3_fs_evictblock(&lfs3, victim,
            LFS3_EVICT_EVICT
                | ((CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_EVICT_BAD, -1)
                    : 0)) => 0;

    // evicted block should no longer be in use
    assert(lfs3.gbmap.b_p.blocks[0] != victim);

    // gbmap_p should have been discarded, so these should be the same
    assert(lfs3.gbmap.b_p.blocks[0] == lfs3.gbmap.b.blocks[0]);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
