    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && (fsinfo.flags & LFS3_I_LOOKGBMAP))
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                // both ckmeta/ckdata cleared!
                // repairdata set! not repairmeta
                | LFS3_I_REPAIRDATA
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                // damaged set!
                | LFS3_I_DAMAGEDREAD
                // maybe condemned set?
                | ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_I_CONDEMNED, -1) : 0)));

