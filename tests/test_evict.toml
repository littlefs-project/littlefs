                rbuf, BLOCK_SIZE) => BLOCK_SIZE;
        assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
    }

    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_off_t wsize_ = BLOCK_SIZE + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)BLOCK_SIZE) {
            wsize_ += BLOCK_SIZE;
        }
        lfs3_file_rewind(&lfs3, &files[k]) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize_; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &files[k],
                    rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        }
    }

    // try writing an additional block to all files, to make sure
    // things still work
    prng = wprng;
    for (lfs3_size_t i = 0; i < wsize; i += 1) {
        TEST_PRNG(&prng);
    }
    lfs3_file_seek(&lfs3, &files[0], 0, LFS3_SEEK_END) => wsize;
    uint8_t wbuf[BLOCK_SIZE];
    for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &files[0],
            wbuf, BLOCK_SIZE) => BLOCK_SIZE;
    lfs3_file_flush(&lfs3, &files[0]) => 0;
    
    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_off_t wsize_ = BLOCK_SIZE + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)BLOCK_SIZE) {
            wsize_ += BLOCK_SIZE;
