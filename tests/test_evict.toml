        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &files[0], wbuf, BLOCK_SIZE) => BLOCK_SIZE;
        lfs3_file_sync(&lfs3, &files[0]) => 0;
        wsize += BLOCK_SIZE;
    }

    // open N-1 other handles
    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_file_open(&lfs3, &files[k], "jellyfish", LFS3_O_RDWR) => 0;

        // use DELTA to derive a somewhat chaotic size for each file,
        // limited to at least BLOCK_SIZE
        lfs3_off_t wsize_ = BLOCK_SIZE + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)BLOCK_SIZE) {
            wsize_ += BLOCK_SIZE;
