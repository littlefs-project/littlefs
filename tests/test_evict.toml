            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE) => BLOCK_SIZE;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
    }

    // figure out the next blocks to be allocated, and damage _those_ blocks
    for (lfs3_size_t i = 0; i < N; i++) {
        lfs3_emubd_mkbad(CFG, lfs3.lookahead.window + i) => 0;
    }

    // rewrite the file, this should try to allocate + write to the damaged
    // blocks
    lfs3_file_rewind(&lfs3, &file) => 0;
    wprng = prng;
    wsize = SIZE;
    for (lfs3_size_t i = 0; i < N; i++) {
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE) => BLOCK_SIZE;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
    }

    // we should _not_ have an entry in our evictqueue (uh, if not
    // condemning)
    assert(lfs3.evictqueue.count == ((CONDEMN) ? EVICTQUEUE_COUNT : 0));

    // this should _not_ set LFS3_I_REPAIRMETA (uh, if not condemning),
    // we found damage, but we should just route around it
    struct lfs3_fsinfo fsinfo;
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && (fsinfo.flags & LFS3_I_LOOKGBMAP))
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                | LFS3_I_CKMETA
                | LFS3_I_CKDATA
                // ok, so we do set LFS3_I_REPAIRMETA, but only if condemned
                //
                // this is not a typo! we always treat progs as metadata
                | ((CONDEMN) ? LFS3_I_REPAIRMETA : 0)
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                // damaged set!
                | LFS3_I_DAMAGEDPROG
                // but we do set condemned! well, if we're condemning
                | ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_I_CONDEMNED, -1) : 0)
                // only set LFS3_I_EVICTOVERFLOW if condemning!
                | ((CONDEMN) ? LFS3_I_EVICTOVERFLOW : 0)));

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {\
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
