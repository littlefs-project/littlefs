# test explicit lfs3_file_ck/repair calls
[cases.test_evict_repair_t_file_explicit_btree]
# CALLS=0 => lfs3_file_repair
# CALLS=1 => lfs3_file_ck     + lfs3_file_repair
# CALLS=2 => lfs3_file_repair + lfs3_file_repair
defines.CALLS = [0, 1, 2]
defines.CHUNK = 'BLOCK_SIZE/8'
defines.SYNC = [false, true]
defines.SIBLING = [0]
# prevent block crystallization
defines.CRYSTAL_THRESH = -1
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
defines.CONDEMN = [false, true]
defines.DAMAGE_FLAGS = '''
    ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_DAMAGE_CONDEMNDAMAGE, -1) : 0)
'''
ifdef = 'LFS3_REPAIR'
if = 'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write to our file until we have a btree
    uint32_t wprng = prng;
    lfs3_off_t wsize = 0;
    // hack, don't use the internals like this
    while ((file.bshrub.trunk & 0x80000000)
            || file.bshrub.weight == 0) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
        wsize += CHUNK;
    }

    // get a block to evict
    lfs3_block_t victim = file.bshrub.blocks[0];

    // make bad
    lfs3_emubd_mkbad(CFG, victim) => 0;
    // note we don't need to request ck flags!

    // call lfs3_file_repair to repair bad blocks
    if (CALLS == 0) {
        lfs3_file_repair(&lfs3, &file,
                LFS3_REPAIR_CKMETA | LFS3_REPAIR_REPAIRMETA) => 0;

    // call lfs3_file_ck to find, and lfs3_file_repair to repair bad blocks
    } else if (CALLS == 1) {
        // calling ck with no flags should noop
        lfs3_file_ck(&lfs3, &file, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.bshrub.blocks[0] == victim);

        // calling repair on its own should do nothing
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.bshrub.blocks[0] == victim);

        // calling ck should find the damage, but not repair it
        lfs3_file_ck(&lfs3, &file, LFS3_CK_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.bshrub.blocks[0] == victim);

        // calling repair should now fix it
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.bshrub.blocks[0] != victim);

    // call lfs3_file_repair to find, and lfs3_file_repair to repair bad blocks
    } else if (CALLS == 2) {
        // calling repair with no flags should noop
        lfs3_file_repair(&lfs3, &file, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.bshrub.blocks[0] == victim);

        // calling repair on its own should do nothing
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.bshrub.blocks[0] == victim);

        // calling repair with ck should find the damage, but not repair it
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.bshrub.blocks[0] == victim);

        // calling repair should now fix it
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.bshrub.blocks[0] != victim);
    }

    // evicted block should no longer be in use
    assert(file.bshrub.blocks[0] != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
