        // calling ck with ckmeta should fail to find damage
        lfs3_file_ck(&lfs3, &file, LFS3_CK_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.leaf.bptr.d.u.disk.block == victim);

        // calling ck should find the damage, but not repair it
        lfs3_file_ck(&lfs3, &file, LFS3_CK_CKDATA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRDATA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.leaf.bptr.d.u.disk.block == victim);

        // calling repair should now fix it
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRDATA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.leaf.bptr.d.u.disk.block != victim);

    // call lfs3_file_repair to find, and lfs3_file_repair to repair bad blocks
    } else if (CALLS == 2) {
        // calling repair with no flags should noop
        lfs3_file_repair(&lfs3, &file, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.leaf.bptr.d.u.disk.block == victim);

        // calling repair on its own should do nothing
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRDATA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.leaf.bptr.d.u.disk.block == victim);

        // calling repair with ckmeta should fail to find damage
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.leaf.bptr.d.u.disk.block == victim);

        // calling repair with ck should find the damage, but not repair it
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_CKDATA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRDATA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.leaf.bptr.d.u.disk.block == victim);

        // calling repair should now fix it
        lfs3_file_repair(&lfs3, &file, LFS3_REPAIR_REPAIRDATA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.leaf.bptr.d.u.disk.block != victim);
    }

    // evicted block should no longer be in use
    assert(file.leaf.bptr.d.u.disk.block != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {\
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''



# these tests are just rude
#
# write to a file, but keep evicting the most recently written block

[cases.test_evict_repair_rude_seq]
defines.SIZE = '8*BLOCK_SIZE'
defines.CHUNK = ['FCACHE_SIZE/2', '2*FCACHE_SIZE', 'BLOCK_SIZE']
# INIT=0 => no init
# INIT=1 => fill with data
# INIT=2 => truncate to size
defines.INIT = [0, 1, 2]
defines.SYNC = [false, true]
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
ifdef = 'LFS3_REPAIR'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "raccoonbutterflyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // simulate our file in ram
    uint8_t sim[SIZE];
    lfs3_off_t size;
    uint32_t prng = 42;
    if (INIT == 0) {
        size = 0;
    } else if (INIT == 1) {
        for (lfs3_size_t i = 0; i < SIZE; i++) {
            sim[i] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, sim, SIZE) => SIZE;
        size = SIZE;
    } else {
        memset(sim, 0, SIZE);
        lfs3_file_truncate(&lfs3, &file, SIZE) => 0;
        size = SIZE;
    }
    // sync?
    if (SYNC) {
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // write to file
    lfs3_file_rewind(&lfs3, &file) => 0;
    for (lfs3_off_t i = 0; i < SIZE; i += CHUNK) {
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            sim[i+j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, &sim[i], CHUNK) => CHUNK;
        size = lfs3_max(size, i+CHUNK);

        // sync?
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }

        // evict? so rude
        if (file.leaf.bptr.d.u.disk.block != 0) {
            lfs3_block_t victim = file.leaf.bptr.d.u.disk.block;

            // make bad
            lfs3_emubd_mkbad(CFG, victim) => 0;
            // request ck flags
            lfs3_fs_requestck(&lfs3, LFS3_GC_CKDATA) => 0;

            // run gc to repair bad blocks
            lfs3_gc_t gc;
            lfs3_gc_open(&lfs3, &gc, LFS3_GC_CKDATA | LFS3_GC_REPAIRDATA) => 0;
            for (lfs3_block_t i = 0;; i++) {
                // a bit hacky, but this catches infinite loops
                //
                // note this takes longer than the evict tests because
                // we need a second pass to clear the ckmeta/ckdata
                // flags
                assert(i < 4*BLOCK_COUNT);

                lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
                assert(steps >= 0);
                if (steps == 0) {
                    break;
                }
            }
            lfs3_gc_close(&lfs3, &gc) => 0;

            // make the block good again
            lfs3_emubd_mkgood(CFG, victim) => 0;

            // evicted block should no longer be in use
            assert(file.leaf.bptr.d.u.disk.block != victim);

            // evicted block should no longer be in use, anywhere in the
            // filesystem
            lfs3_trv_t trv;
            lfs3_trv_open(&lfs3, &trv, 0) => 0;
            for (lfs3_block_t i = 0;; i++) {
                assert(i < 2*BLOCK_COUNT);

                struct lfs3_binfo binfo;
                int err = lfs3_trv_read(&lfs3, &trv, &binfo);
                assert(!err || err == LFS3_ERR_NOENT);
                if (err == LFS3_ERR_NOENT) {
                    break;
                }

                assert(binfo.block != victim);
            }
            lfs3_trv_close(&lfs3, &trv) => 0;
        }
    }

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "raccoonbutterflyfish",
                    LFS3_O_RDONLY) => 0;
        }

        // is size correct?
        lfs3_file_size(&lfs3, &file) => size;
        // try reading
        uint8_t rbuf[2*SIZE];
        memset(rbuf, 0xaa, 2*SIZE);
        lfs3_file_rewind(&lfs3, &file) => 0;
        lfs3_file_read(&lfs3, &file, rbuf, 2*SIZE) => size;
        assert(memcmp(rbuf, sim, size) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

