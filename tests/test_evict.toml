        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        uint8_t rbuf[CHUNK];
        lfs3_file_read(&lfs3, &files[0],
                rbuf, CHUNK) => CHUNK;
        assert(memcmp(rbuf, wbuf, CHUNK) == 0);
    }

    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_off_t wsize_ = CHUNK + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)CHUNK) {
            wsize_ += CHUNK;
        }
        lfs3_file_rewind(&lfs3, &files[k]) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize_; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &files[k],
                    rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }
    }

    // try writing an additional block to all files, to make sure
    // things still work
    prng = wprng;
    for (lfs3_size_t i = 0; i < wsize; i += 1) {
        TEST_PRNG(&prng);
    }
    lfs3_file_seek(&lfs3, &files[0], 0, LFS3_SEEK_END) => wsize;
    uint8_t wbuf[CHUNK];
    for (lfs3_size_t j = 0; j < CHUNK; j++) {
        wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &files[0],
            wbuf, CHUNK) => CHUNK;
    lfs3_file_flush(&lfs3, &files[0]) => 0;
    
    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_off_t wsize_ = CHUNK + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)CHUNK) {
            wsize_ += CHUNK;
        }
        prng = wprng;
        for (lfs3_size_t i = 0; i < wsize_; i += 1) {
            TEST_PRNG(&prng);
        }
        lfs3_file_seek(&lfs3, &files[k], 0, LFS3_SEEK_END) => wsize_;
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &files[k],
                wbuf, CHUNK) => CHUNK;
        lfs3_file_flush(&lfs3, &files[k]) => 0;
    }

    // check we can still read the files
    lfs3_file_rewind(&lfs3, &files[0]) => 0;
    prng = wprng;
    for (lfs3_off_t i = 0; i < wsize+CHUNK; i += CHUNK) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        uint8_t rbuf[CHUNK];
        lfs3_file_read(&lfs3, &files[0],
                rbuf, CHUNK) => CHUNK;
        assert(memcmp(rbuf, wbuf, CHUNK) == 0);
    }

    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_off_t wsize_ = CHUNK + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)CHUNK) {
            wsize_ += CHUNK;
        }
        lfs3_file_rewind(&lfs3, &files[k]) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize_+CHUNK; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &files[k],
                    rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }
    }

    lfs3_file_close(&lfs3, &files[0]) => 0;
    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_file_desync(&lfs3, &files[k]) => 0;
        lfs3_file_close(&lfs3, &files[k]) => 0;
    }
    lfs3_unmount(&lfs3) => 0;
'''

# some alternative API tests

# test explicit lfs3_fs_ck/repair calls
[cases.test_evict_repair_t_explicit_mdir]
# CALLS=0 => lfs3_fs_repair
# CALLS=1 => lfs3_fs_ck     + lfs3_fs_repair
# CALLS=2 => lfs3_fs_repair + lfs3_fs_repair
# CALLS=3 => lfs3_fs_ck     + lfs3_fs_repair + MTREEONLY
# CALLS=4 => lfs3_fs_repair + lfs3_fs_repair + MTREEONLY
defines.CALLS = [0, 1, 2, 3, 4]
defines.SIZE = 'FCACHE_SIZE/2'
defines.SIBLING = [0]
# force early relocations, this will cause the mroot anchor to extend
defines.BLOCK_RECYCLES = 0
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
defines.CONDEMN = [false, true]
defines.DAMAGE_FLAGS = '''
    ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_DAMAGE_CONDEMNDAMAGE, -1) : 0)
'''
ifdef = 'LFS3_REPAIR'
if = 'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // write to our mroot until it's not the mrootanchor
    //
    // we can't evict the mrootanchor
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf[SIZE];
    while (file.h.mdir.r.blocks[0] == 0
            || file.h.mdir.r.blocks[0] == 1) {
        lfs3_file_rewind(&lfs3, &file) => 0;
        for (lfs3_size_t j = 0; j < SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, SIZE) => SIZE;
        lfs3_file_sync(&lfs3, &file) => 0;
    }

    // get a block to evict
    lfs3_block_t victim = file.h.mdir.r.blocks[SIBLING];

    // make bad
    lfs3_emubd_mkbad(CFG, victim) => 0;
    // note we don't need to request ck flags!

    // call lfs3_fs_repair to repair bad blocks
    if (CALLS == 0) {
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_CKMETA | LFS3_REPAIR_REPAIRMETA) => 0;

    // call lfs3_fs_ck to find, and lfs3_fs_repair to repair bad blocks
    } else if (CALLS == 1) {
        // calling ck with no flags should noop
        lfs3_fs_ck(&lfs3, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling ck should find the damage, but not repair it
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] != victim);

    // call lfs3_fs_repair to find, and lfs3_fs_repair to repair bad blocks
    } else if (CALLS == 2) {
        // calling repair with no flags should noop
        lfs3_fs_repair(&lfs3, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair with ck should find the damage, but not repair it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] != victim);

    // call lfs3_fs_ck to find, and lfs3_fs_repair to repair bad blocks
    //
    // this time with LFS3_CK_MTREEONLY
    } else if (CALLS == 3) {
        // calling ck with no flags should noop
        lfs3_fs_ck(&lfs3, LFS3_CK_MTREEONLY) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_REPAIRMETA | LFS3_REPAIR_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling ck should find the damage, but not repair it
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_REPAIRMETA | LFS3_REPAIR_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] != victim);

    // call lfs3_fs_repair to find, and lfs3_fs_repair to repair bad blocks
    //
    // this time with LFS3_REPAIR_MTREEONLY
    } else if (CALLS == 4) {
        // calling repair with no flags should noop
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_MTREEONLY) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_REPAIRMETA | LFS3_REPAIR_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair with ck should find the damage, but not repair it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_CKMETA | LFS3_REPAIR_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        assert(file.h.mdir.r.blocks[SIBLING] == victim);

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_REPAIRMETA | LFS3_REPAIR_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        assert(file.h.mdir.r.blocks[SIBLING] != victim);
    }

    // evicted block should no longer be in use
    assert(file.h.mdir.r.blocks[0] != victim);
    assert(file.h.mdir.r.blocks[1] != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        uint8_t rbuf[SIZE];
        lfs3_file_read(&lfs3, &file, rbuf, SIZE) => SIZE;
        assert(memcmp(rbuf, wbuf, SIZE) == 0);
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_evict_repair_t_explicit_btree]
# CALLS=0 => lfs3_fs_repair
# CALLS=1 => lfs3_fs_ck     + lfs3_fs_repair
# CALLS=2 => lfs3_fs_repair + lfs3_fs_repair
defines.CALLS = [0, 1, 2]
defines.CHUNK = 'BLOCK_SIZE/8'
defines.SYNC = [false, true]
defines.CLOSE = [false, true]
defines.SIBLING = [0]
# prevent block crystallization
defines.CRYSTAL_THRESH = -1
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
defines.CONDEMN = [false, true]
defines.DAMAGE_FLAGS = '''
    ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_DAMAGE_CONDEMNDAMAGE, -1) : 0)
'''
ifdef = 'LFS3_REPAIR'
if = 'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write to our file until we have a btree
    uint32_t wprng = prng;
    lfs3_off_t wsize = 0;
    // hack, don't use the internals like this
    while ((file.bshrub.trunk & 0x80000000)
            || file.bshrub.weight == 0) {
        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
        wsize += CHUNK;
    }

    // close during eviction? this makes sure eviction can find the
    // btree on disk
    if (CLOSE) {
        lfs3_file_close(&lfs3, &file) => 0;
    }

    // get a block to evict
    lfs3_block_t victim = file.bshrub.blocks[0];

    // make bad
    lfs3_emubd_mkbad(CFG, victim) => 0;
    // note we don't need to request ck flags!

    // call lfs3_fs_repair to repair bad blocks
    if (CALLS == 0) {
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_CKMETA | LFS3_REPAIR_REPAIRMETA) => 0;

    // call lfs3_fs_ck to find, and lfs3_fs_repair to repair bad blocks
    } else if (CALLS == 1) {
        // calling ck with no flags should noop
        lfs3_fs_ck(&lfs3, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling ck with mtreeonly should fail to find the damage
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling ck should find the damage, but not repair it
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] != victim);
        }

    // call lfs3_fs_repair to find, and lfs3_fs_repair to repair bad blocks
    } else if (CALLS == 2) {
        // calling repair with no flags should noop
        lfs3_fs_repair(&lfs3, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling repair with mtreeonly should fail to find the damage
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_CKMETA | LFS3_REPAIR_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling repair with ck should find the damage, but not repair it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] == victim);
        }

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
        if (!CLOSE) {
            assert(file.bshrub.blocks[0] != victim);
        }
    }

    // reopen if necessary
    if (CLOSE) {
        lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDWR) => 0;
    }

    // evicted block should no longer be in use
    assert(file.bshrub.blocks[0] != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

[cases.test_evict_repair_t_explicit_bshrub]
# CALLS=0 => lfs3_fs_repair
# CALLS=1 => lfs3_fs_ck     + lfs3_fs_repair
# CALLS=2 => lfs3_fs_repair + lfs3_fs_repair
defines.CALLS = [0, 1, 2]
defines.CHUNK = 'BLOCK_SIZE/8'
defines.SYNC = [false, true]
defines.CLOSE = [false, true]
defines.SIBLING = [0, 1, 2]
# prevent block crystallization
defines.CRYSTAL_THRESH = -1
# report as damaged to request repairs
defines.BADBLOCK_BEHAVIOR = 'LFS3_EMUBD_BADBLOCK_READDAMAGED'
defines.CONDEMN = [false, true]
defines.DAMAGE_FLAGS = '''
    ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_DAMAGE_CONDEMNDAMAGE, -1) : 0)
'''
ifdef = 'LFS3_REPAIR'
if = 'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;

    // write to our file until we are a bshrub and have at least
    // 3 btree node
    uint32_t wprng = prng;
    lfs3_off_t wsize = 0;
    while (true) {
        if (file.bshrub.trunk & 0x80000000) {
            lfs3_size_t count = 0;
            lfs3_trv_t trv;
            lfs3_trv_open(&lfs3, &trv, 0) => 0;
            for (lfs3_block_t i = 0;; i++) {
                assert(i < 2*BLOCK_COUNT);

                struct lfs3_binfo binfo;
                int err = lfs3_trv_read(&lfs3, &trv, &binfo);
                assert(!err || err == LFS3_ERR_NOENT);
                if (err == LFS3_ERR_NOENT) {
                    break;
                }

                if (binfo.btype == LFS3_BTYPE_BTREE) {
                    count += 1;
                }
            }
            lfs3_trv_close(&lfs3, &trv) => 0;
            if (count >= 3 + ((GBMAP) ? 1 : 0)) {
                break;
            }
        }

        uint8_t wbuf[CHUNK];
        for (lfs3_size_t j = 0; j < CHUNK; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, CHUNK) => CHUNK;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
        wsize += CHUNK;
    }

    // close during gc? this makes sure gc can find the btree on disk
    if (CLOSE) {
        lfs3_file_close(&lfs3, &file) => 0;
    }

    // get a block to evict
    lfs3_block_t victim = 0;
    lfs3_size_t count = 0;
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err);

        if (binfo.btype == LFS3_BTYPE_BTREE) {
            if (count == SIBLING) {
                victim = binfo.block;
                break;
            }

            count += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // make bad
    lfs3_emubd_mkbad(CFG, victim) => 0;
    // note we don't need to request ck flags!

    // call lfs3_fs_repair to repair bad blocks
    if (CALLS == 0) {
        lfs3_fs_repair(&lfs3,
                LFS3_REPAIR_CKMETA | LFS3_REPAIR_REPAIRMETA) => 0;

    // call lfs3_fs_ck to find, and lfs3_fs_repair to repair bad blocks
    } else if (CALLS == 1) {
        // calling ck with no flags should noop
        lfs3_fs_ck(&lfs3, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling ck with mtreeonly should fail to find the damage
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA | LFS3_CK_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling ck should find the damage, but not repair it
        lfs3_fs_ck(&lfs3, LFS3_CK_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

    // call lfs3_fs_repair to find, and lfs3_fs_repair to repair bad blocks
    } else if (CALLS == 2) {
        // calling repair with no flags should noop
        lfs3_fs_repair(&lfs3, 0) => 0;
        struct lfs3_fsinfo fsinfo;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling repair on its own should do nothing
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling repair with mtreeonly should fail to find the damage
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_CKMETA | LFS3_REPAIR_MTREEONLY) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling repair with ck should find the damage, but not repair it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == LFS3_I_REPAIRMETA);
        assert(lfs3.evictqueue.count == 1);

        // calling repair should now fix it
        lfs3_fs_repair(&lfs3, LFS3_REPAIR_REPAIRMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);
    }

    // reopen if necessary
    if (CLOSE) {
        lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDWR) => 0;
    }

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += CHUNK) {
            uint8_t wbuf[CHUNK];
            for (lfs3_size_t j = 0; j < CHUNK; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[CHUNK];
            lfs3_file_read(&lfs3, &file, rbuf, CHUNK) => CHUNK;
            assert(memcmp(rbuf, wbuf, CHUNK) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
'''

