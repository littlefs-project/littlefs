    // try creating a second file to make sure the gbmap wasn't
    // corrupted
    lfs3_file_t file2;
    lfs3_file_open(&lfs3, &file2, "octopus",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    for (lfs3_off_t i = 0; i < wsize/4; i += CHUNK) {
