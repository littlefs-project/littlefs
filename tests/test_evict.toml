    lfs3_file_t file1;
    lfs3_file_open(&lfs3, &file1, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf1[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf1[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file1, wbuf1, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file1) => 0;

    lfs3_file_t file2;
    lfs3_file_open(&lfs3, &file2, "octopus",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint8_t wbuf2[SIZE];
    for (lfs3_size_t j = 0; j < SIZE; j++) {
        wbuf2[j] = 'a' + (TEST_PRNG(&prng) % 26);
    }
    lfs3_file_write(&lfs3, &file2, wbuf2, SIZE) => SIZE;
    lfs3_file_sync(&lfs3, &file2) => 0;

    // create more files until we have an mtree
    lfs3_size_t i = 0;
    // hack, don't use the internals like this
    while (lfs3.mtree.weight == 0) {
        char name[256];
        sprintf(name, "medusaaaaaaaaaaaaaaaa%03x", i);
        lfs3_file_t file;
        lfs3_file_open(&lfs3, &file, name,
                LFS3_O_WRONLY | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
        // let's speed this up a bit
        file.h.mdir.r.eoff = -1;
        lfs3_file_close(&lfs3, &file) => 0;
        i += 1;
    }

    // get a block to evict
    lfs3_block_t victim = lfs3.mtree.blocks[0];

    // try evicting
    lfs3_fs_evictblock(&lfs3, victim,
            LFS3_EVICT_EVICT
                | ((CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_EVICT_BAD, -1)
                    : 0)) => 0;

    // evicted block should no longer be in use
    assert(lfs3.mtree.blocks[0] != victim);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
