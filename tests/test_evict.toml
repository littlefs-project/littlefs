    assert(lfs3.evictqueue.count == 0);

    // LFS3_I_REPAIRMETA should be cleared (but not fixed)
    lfs3_fs_stat(&lfs3, &fsinfo) => 0;
    assert(fsinfo.flags == (
            ((!GBMAP) ? LFS3_I_LOOKAHEAD : 0)
                | ((GBMAP && (fsinfo.flags & LFS3_I_LOOKGBMAP))
                    ? LFS3_IFDEF_GBMAP(LFS3_I_LOOKGBMAP, -1)
                    : 0)
                | LFS3_IFDEF_PREERASE((GBMAP) ? LFS3_I_PREERASE : 0, 0)
                | LFS3_I_COMPACTMETA
                // ckmeta cleared! not ckdata
                | LFS3_I_CKDATA
                // repairmeta cleared!
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_I_GBMAP, -1) : 0)
                // maybe damaged set?
                | ((!STICKY) ? LFS3_I_DAMAGEDREAD : 0)
                // maybe condemned set?
                | ((!STICKY && CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_I_CONDEMNED, -1)
                    : 0)));

    // reopen if necessary
    if (CLOSE) {
        lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDWR) => 0;
    }

    // check we can still read the file
    for (int remount = 0; remount < 2; remount++) {
        // remount?
        if (remount) {
            lfs3_file_close(&lfs3, &file) => 0;
            lfs3_unmount(&lfs3) => 0;
            lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;
            lfs3_file_open(&lfs3, &file, "jellyfish", LFS3_O_RDONLY) => 0;
        }

        lfs3_file_rewind(&lfs3, &file) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {\
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file, rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    lfs3_unmount(&lfs3) => 0;
