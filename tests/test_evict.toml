        // we should not have split yet
        assert(lfs3.mtree.weight == 0);
        // we need internals to check this
        lfs3_ssize_t estimate = lfs3_mdir_estimate__(&lfs3,
                &file1.h.mdir, -1, -1,
                NULL);
        assert(estimate >= 0);
        if ((file1.h.mdir.r.eoff & 0x7fffffff) > GC_COMPACTMETA_THRESH
