            prng = wprng;
            for (lfs3_size_t i = 0; i < wsize; i += 1) {
                TEST_PRNG(&prng);
            }
            lfs3_file_seek(&lfs3, &files[k], 0, LFS3_SEEK_END) => wsize;
            for (lfs3_size_t i = wsize; i < wsize_; i += BLOCK_SIZE) {
                uint8_t wbuf[BLOCK_SIZE];
                for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
                    wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
                }
                lfs3_file_write(&lfs3, &files[k],
                        wbuf, BLOCK_SIZE) => BLOCK_SIZE;
            }
            lfs3_file_flush(&lfs3, &files[k]) => 0;
            // block evictions ignore desync, which risks complicating
            // things
            if (DESYNC) {
                lfs3_file_desync(&lfs3, &files[k]) => 0;
            }
        }
    }

    // get a block to evict
    lfs3_block_t victim = 0;
    lfs3_size_t count = 0;
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err);

        if (binfo.btype == LFS3_BTYPE_DATA) {
            if (count == SIBLING) {
                victim = binfo.block;
                break;
            }

            count += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // make bad
    lfs3_emubd_mkbad(CFG, victim) => 0;
    // request ck flags
    lfs3_fs_requestck(&lfs3, LFS3_GC_CKDATA) => 0;

    // run gc to repair bad blocks
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc, LFS3_GC_CKDATA | LFS3_GC_REPAIRDATA) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
    #ifdef LFS3_GBMAP
    if (CONDEMN) {
        struct lfs3_binfo binfo;
        lfs3_fs_statblock(&lfs3, victim, &binfo) => 0;
        assert(binfo.btype == LFS3_BTYPE_BAD);
        assert(binfo.block == victim);
    }
    #endif

    // check we can still read the files
    lfs3_file_rewind(&lfs3, &files[0]) => 0;
    prng = wprng;
    for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
        uint8_t wbuf[BLOCK_SIZE];
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        uint8_t rbuf[BLOCK_SIZE];
        lfs3_file_read(&lfs3, &files[0],
                rbuf, BLOCK_SIZE) => BLOCK_SIZE;
        assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
    }

    for (lfs3_size_t k = 1; k < N; k++) {
        lfs3_off_t wsize_ = BLOCK_SIZE + DELTA*k;
        while ((lfs3_soff_t)wsize_ < (lfs3_soff_t)BLOCK_SIZE) {
            wsize_ += BLOCK_SIZE;
        }
        lfs3_file_rewind(&lfs3, &files[k]) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize_; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &files[k],
                    rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
