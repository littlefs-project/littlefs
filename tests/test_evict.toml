    // check we can still read the files
    lfs3_file_rewind(&lfs3, &file) => 0;
    prng = wprng;
    for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
        uint8_t wbuf[BLOCK_SIZE];
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        uint8_t rbuf[BLOCK_SIZE];
        lfs3_file_read(&lfs3, &file,
                rbuf, BLOCK_SIZE) => BLOCK_SIZE;
        assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
    }

    if (HANDLESET & 0x1) {
        lfs3_file_rewind(&lfs3, &file_mutated) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            if (i == 0) {
                wbuf[0] = '!';
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file_mutated,
                    rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        }
    }

    if (HANDLESET & 0x2) {
        lfs3_file_rewind(&lfs3, &file_desync) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file_desync,
                    rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        }
    }

    if (HANDLESET & 0x4) {
        lfs3_file_rewind(&lfs3, &file_desync_mutated) => 0;
        prng = wprng;
        for (lfs3_off_t i = 0; i < wsize; i += BLOCK_SIZE) {
            uint8_t wbuf[BLOCK_SIZE];
            for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
                wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
            }
            if (i == 0) {
                wbuf[0] = '!';
            }
            uint8_t rbuf[BLOCK_SIZE];
            lfs3_file_read(&lfs3, &file_desync_mutated,
                    rbuf, BLOCK_SIZE) => BLOCK_SIZE;
            assert(memcmp(rbuf, wbuf, BLOCK_SIZE) == 0);
        }
    }

    lfs3_file_close(&lfs3, &file) => 0;
    if (HANDLESET & 0x1) {
        lfs3_file_desync(&lfs3, &file_mutated) => 0;
        lfs3_file_close(&lfs3, &file_mutated) => 0;
    }
    if (HANDLESET & 0x2) {
        lfs3_file_close(&lfs3, &file_desync) => 0;
    }
    if (HANDLESET & 0x4) {
        lfs3_file_close(&lfs3, &file_desync_mutated) => 0;
    }
    lfs3_unmount(&lfs3) => 0;
'''

# test bptrs are updated correctly, even when referenced by unrelated
# btrees
