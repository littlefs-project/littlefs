    lfs3_block_t victim = 0;
    lfs3_size_t count = 0;
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err);

        if (binfo.btype == LFS3_BTYPE_DATA) {
            if (count == SIBLING) {
                victim = binfo.block;
                break;
            }

            count += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // try evicting
    lfs3_fs_evictblock(&lfs3, victim,
            LFS3_EVICT_EVICT
                | ((CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_EVICT_BAD, -1)
                    : 0)) => 0;

