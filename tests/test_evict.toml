        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
                == 0);
        assert(lfs3.evictqueue.count == 0);

        // calling ck should find the damage, but not repair it
        lfs3_file_ck(&lfs3, &file, LFS3_CK_CKMETA) => 0;
        lfs3_fs_stat(&lfs3, &fsinfo) => 0;
        assert((fsinfo.flags & (LFS3_I_REPAIRMETA | LFS3_I_REPAIRDATA))
