                break;
            }

            count += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // try evicting
    lfs3_fs_evictblock(&lfs3, victim,
            LFS3_EVICT_EVICT
                | ((CONDEMN)
                    ? LFS3_IFDEF_CONDEMN(LFS3_EVICT_BAD, -1)
                    : 0)) => 0;

    // gbmap_p should have been discarded, so these should be the same
    assert(lfs3.gbmap.b_p.blocks[0] == lfs3.gbmap.b.blocks[0]);

    // evicted block should no longer be in use, anywhere in the
    // filesystem
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        assert(binfo.block != victim);
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // if bad, evicted block should be marked as bad
