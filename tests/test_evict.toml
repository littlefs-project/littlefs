defines.CONDEMN = [false, true]
defines.DAMAGE_FLAGS = '''
    ((CONDEMN) ? LFS3_IFDEF_CONDEMN(LFS3_DAMAGE_CONDEMNDAMAGE, -1) : 0)
'''
ifdef = 'LFS3_REPAIR'
if = 'LFS3_IFDEF_CONDEMN(GBMAP || !CONDEMN, !CONDEMN)'
code = '''
    lfs3_t lfs3;
    lfs3_format(&lfs3,
            LFS3_F_RDWR
                | ((GBMAP) ? LFS3_IFDEF_GBMAP(LFS3_F_GBMAP, -1) : 0),
            CFG) => 0;
    lfs3_mount(&lfs3, LFS3_M_RDWR, CFG) => 0;

    uint32_t prng = 42;

    // create a file large enough for the number of blocks we need
    lfs3_file_t file;
    lfs3_file_open(&lfs3, &file, "jellyfish",
            LFS3_O_RDWR | LFS3_O_CREAT | LFS3_O_EXCL) => 0;
    uint32_t wprng = prng;
    lfs3_off_t wsize = SIZE;
    uint8_t wbuf[BLOCK_SIZE];
    for (lfs3_size_t i = 0; i < N; i++) {
        for (lfs3_size_t j = 0; j < BLOCK_SIZE; j++) {
            wbuf[j] = 'a' + (TEST_PRNG(&prng) % 26);
        }
        lfs3_file_write(&lfs3, &file, wbuf, BLOCK_SIZE) => BLOCK_SIZE;
        if (SYNC) {
            lfs3_file_sync(&lfs3, &file) => 0;
        }
    }
    if (CLOSE) {
        lfs3_file_close(&lfs3, &file) => 0;
    }

    // damage this number of blocks
    lfs3_size_t damaged = 0;
    lfs3_trv_t trv;
    lfs3_trv_open(&lfs3, &trv, 0) => 0;
    for (lfs3_block_t i = 0;; i++) {
        assert(i < 2*BLOCK_COUNT);

        struct lfs3_binfo binfo;
        int err = lfs3_trv_read(&lfs3, &trv, &binfo);
        assert(!err || err == LFS3_ERR_NOENT);
        if (err == LFS3_ERR_NOENT) {
            break;
        }

        // only target data blocks
        if (binfo.btype == LFS3_BTYPE_DATA
                && damaged < N) {
            lfs3_emubd_mkbad(CFG, binfo.block) => 0;
            damaged += 1;
        }
    }
    lfs3_trv_close(&lfs3, &trv) => 0;

    // did we damage the expected number of blocks? otherwise our test
    // no worky
    assert(damaged == N);

    // run gc to check for data damage
    lfs3_gc_t gc;
    lfs3_gc_open(&lfs3, &gc, LFS3_GC_CKDATA) => 0;
    for (lfs3_block_t i = 0;; i++) {
        // a bit hacky, but this catches infinite loops
        assert(i < 2*BLOCK_COUNT);

        lfs3_sblock_t steps = lfs3_gc_write(&lfs3, &gc, 1);
        assert(steps >= 0);
        if (steps == 0) {
            break;
        }
    }
    lfs3_gc_close(&lfs3, &gc) => 0;

